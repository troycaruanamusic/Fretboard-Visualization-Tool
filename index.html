<!DOCTYPE html>
<!--

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fretboard Trainer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0D131A;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:transparent;padding:0;color:inherit}
  .w-full{width:100%}
  .p-4{padding:1rem}.p-3{padding:.75rem}.p-2{padding:.5rem}
  .pb-2{padding-bottom:.5rem}
  .px-2{padding-left:.5rem;padding-right:.5rem}
  .px-2\.5{padding-left:.625rem;padding-right:.625rem}
  .py-1{padding-top:.25rem;padding-bottom:.25rem}
  .py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
  .py-0\.5{padding-top:.125rem;padding-bottom:.125rem}
  .mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
  .mt-1\.5{margin-top:.375rem}.mt-3{margin-top:.75rem}
  .ml-1{margin-left:.25rem}
  .mr-1{margin-right:.25rem}
  .rounded{border-radius:.25rem}.rounded-md{border-radius:.375rem}.rounded-lg{border-radius:.5rem}
  .rounded-xl{border-radius:.75rem}.rounded-2xl{border-radius:1rem}.rounded-full{border-radius:9999px}
  .flex{display:flex}.grid{display:grid}.contents{display:contents}
  .flex-wrap{flex-wrap:wrap}.flex-col{flex-direction:column}
  .items-center{align-items:center}.items-end{align-items:flex-end}
  .justify-center{justify-content:center}
  .gap-1{gap:.25rem}.gap-1\.5{gap:.375rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}
  .relative{position:relative}.absolute{position:absolute}.left-0{left:0}.right-0{right:0}
  .overflow-x-auto{overflow-x:auto}
  .text-xs{font-size:12.5px;line-height:1rem}
  .text-sm{font-size:.875rem;line-height:1.25rem}
  .text-xl{font-size:1.25rem;line-height:1.75rem}
  .font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
  .underline{text-decoration:underline}
  .text-body{color:#E3E9F0}.text-muted{color:#A9B6C4}.text-link{color:#9CC6EE}
  .row{display:flex;align-items:flex-start;gap:8px}
  .rowlab{flex:0 0 92px;min-height:34px;display:flex;align-items:center;font-size:12.5px;color:#A9B6C4;white-space:nowrap}
  .track{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:8px;background:#091017;min-width:0}
  .transition-colors{transition:background-color .15s,border-color .15s,color .15s}
  .transition-all{transition:all .15s}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;
const VERSION = "v0.23";
document.title = `Fretboard Trainer · ${VERSION}`;

// ChordCharts Dark tokens (BR-01). Colour roles (BR-02): gold = the key, CAGED = position, greyscale = everything else.
const THEME = { bg:"#0D131A", panel:"#141C25", panel2:"#1B2530", track:"#091017", ctl:"#2A3645", ctlHover:"#344253", edge:"#6C7C8E", line:"#334252", text:"#E3E9F0", muted:"#A9B6C4", sel:"#E8C66E", onSel:"#16120A", ink:"#16232F", nut:"#C5D0DC", link:"#9CC6EE" };
const TABS = [["trainer","Trainer"],["display","Display"],["reference","Reference"],["info","Info"]];

const NOTES_SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTES_FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
// Key names per tonality; minor keys use the common spellings (C♯, G♯ minor rather than D♭, A♭ minor).
const KEY_NAME = {
  major: ["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"],
  minor: ["C","C#","D","Eb","E","F","F#","G","G#","A","Bb","B"],
};
const LETTERS = ["C","D","E","F","G","A","B"];
const LETTER_PC = [0,2,4,5,7,9,11];
const OPEN = [4,11,7,2,9,4];
const OPEN_ABS = [64,59,55,50,45,40]; // e4 B3 G3 D3 A2 E2 as MIDI numbers, for pitch order across strings
const STRING_LABELS = ["e","B","G","D","A","E"];
const STRING_GAUGE = [1.2,1.6,2.1,2.6,3.2,3.8];
const FRETS = 15;
const MARKERS = {3:1,5:1,7:1,9:1,12:2,15:1};

const DEG_LABEL = {0:"R",1:"♭2",2:"2",3:"♭3",4:"3",5:"4",6:"♭5",7:"5",8:"♭6",9:"6",10:"♭7",11:"7"};
const MONO_GREY = "#5b6679";
// Degrees the formula names differently from the semitone default (TH-05). Keys: scale mode or chord quality.
const DEG_OVERRIDE = { lydian: {6:"♯4"}, aug: {8:"♯5"}, aug7: {8:"♯5"}, dim7: {9:"°7"} };

// Grouped as Triads, Sevenths, Added notes (UX-04); the same qualities per tonality as v0.21.
const ARP_QUAL = {
  major: [
    ["Triads", [["triad","Triad"],["sus2","sus2"],["sus4","sus4"],["aug","aug"],["dim","dim"]]],
    ["Sevenths", [["maj7","maj7"],["dom7","7"],["7sus4","7sus4"],["aug7","aug7"],["m7b5","m7♭5"],["dim7","dim7"]]],
    ["Added notes", [["add9","add9"],["add11","add11"],["add13","6"]]],
  ],
  minor: [
    ["Triads", [["triad","Triad"],["sus2","sus2"],["sus4","sus4"],["dim","dim"]]],
    ["Sevenths", [["min7","m7"],["7sus4","7sus4"],["m7b5","m7♭5"],["dim7","dim7"]]],
    ["Added notes", [["madd9","add9"],["madd11","add11"],["m6","6"]]],
  ],
};
const ARP_ALL = (t) => ARP_QUAL[t].flatMap(([, qs]) => qs);
// Header summary names (UX-07).
const QUAL_NAME = { maj7:"maj7", dom7:"7", min7:"m7", m7b5:"m7♭5", dim7:"dim7", aug7:"aug7", add9:"add9", add11:"add11", add13:"6", m6:"m6", madd9:"m(add9)", madd11:"m(add11)", sus2:"sus2", sus4:"sus4", "7sus4":"7sus4" };
const MODE_NAME = { ionian:"Ionian", lydian:"Lydian", mixolydian:"Mixolydian", aeolian:"Aeolian", dorian:"Dorian", phrygian:"Phrygian", harmonic:"harmonic minor", melodic:"melodic minor" };

const DIATONIC = {
  major: [["I",0,"maj"],["ii",2,"min"],["iii",4,"min"],["IV",5,"maj"],["V",7,"maj"],["vi",9,"min"],["vii°",11,"dim"]],
  minor: [["i",0,"min"],["ii°",2,"dim"],["III",3,"maj"],["iv",5,"min"],["v",7,"min"],["VI",8,"maj"],["♭VII",10,"maj"]],
};

const KEY_DEG = {
  major: { 0: "1", 2: "2", 4: "3", 5: "4", 7: "5", 9: "6", 11: "7" },
  minor: { 0: "1", 2: "2", 3: "♭3", 5: "4", 7: "5", 8: "♭6", 10: "♭7" },
};

const MODES = {
  major: [["ionian","Ionian"],["lydian","Lydian"],["mixolydian","Mixolydian"]],
  minor: [["aeolian","Aeolian"],["dorian","Dorian"],["phrygian","Phrygian"],["harmonic","Harmonic"],["melodic","Melodic"]],
};
const MODE_IV = {
  ionian: [0,2,4,5,7,9,11], lydian: [0,2,4,6,7,9,11], mixolydian: [0,2,4,5,7,9,10],
  aeolian: [0,2,3,5,7,8,10], dorian: [0,2,3,5,7,9,10], phrygian: [0,1,3,5,7,8,10],
  harmonic: [0,2,3,5,7,8,11], melodic: [0,2,3,5,7,9,11],
};

// Calmer CAGED set (decision 7 = b), all with ink labels (DS-04).
const POS_COLOR = {C:"#E5766B",A:"#E9A15C",G:"#DDD05A",E:"#7FA8E6",D:"#7CC68D"};
const POS_MAJOR = [{num:1,letter:"C",off:4,w:3},{num:2,letter:"A",off:6,w:3},{num:3,letter:"G",off:9,w:3},{num:4,letter:"E",off:-1,w:3},{num:5,letter:"D",off:1,w:4}];
const POS_MINOR = [{num:1,letter:"C",off:4,w:4},{num:2,letter:"A",off:7,w:3},{num:3,letter:"G",off:9,w:3},{num:4,letter:"E",off:0,w:3},{num:5,letter:"D",off:2,w:3}];

function scopeIntervals(t, scope, arp, mode) {
  if (scope === "arpeggio") {
    if (arp === "maj7") return [0,4,7,11];
    if (arp === "dom7") return [0,4,7,10];
    if (arp === "min7") return [0,3,7,10];
    if (arp === "m7b5") return [0,3,6,10];
    if (arp === "dim") return [0,3,6];
    if (arp === "dim7") return [0,3,6,9];
    if (arp === "aug") return [0,4,8];
    if (arp === "aug7") return [0,4,8,10];
    if (arp === "add9") return [0,4,7,2];
    if (arp === "add11") return [0,4,7,5];
    if (arp === "add13") return [0,4,7,9];
    if (arp === "m6") return [0,3,7,9];
    if (arp === "madd9") return [0,3,7,2];
    if (arp === "madd11") return [0,3,7,5];
    if (arp === "sus2") return [0,2,7];
    if (arp === "sus4") return [0,5,7];
    if (arp === "7sus4") return [0,5,7,10];
    return t === "major" ? [0,4,7] : [0,3,7];
  }
  if (scope === "pentatonic") return t === "major" ? [0,2,4,7,9] : [0,3,5,7,10];
  if (scope === "blues") return t === "major" ? [0,2,3,4,7,9] : [0,3,5,6,7,10];
  if (scope === "scale") return MODE_IV[mode] || (t === "major" ? [0,2,4,5,7,9,11] : [0,2,3,5,7,8,10]);
  return [0,2,3,4,5,7,9,10];
}
const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
// Letter index li (0 = C, wraps) plus the accidental that reaches pitch class pc.
const spellAt = (li, pc) => {
  const l = ((li % 7) + 7) % 7;
  let d = (((pc - LETTER_PC[l]) % 12) + 12) % 12;
  if (d > 6) d -= 12;
  return LETTERS[l] + (d > 0 ? "#".repeat(d) : "b".repeat(-d));
};
// The seven notes of the key (Ionian or Aeolian), spelled from the key signature (TH-01).
function keySpelling(keyRoot, keyMode) {
  const li = LETTERS.indexOf(KEY_NAME[keyMode][keyRoot][0]);
  const map = {};
  MODE_IV[keyMode === "major" ? "ionian" : "aeolian"].forEach((s, k) => {
    const pc = (keyRoot + s) % 12;
    map[pc] = { name: spellAt(li + k, pc), letter: li + k };
  });
  return map;
}

// A choice on a recessed track (BR-03, decision 4 = a). Chosen: grey thumb with a 1.5 px text ring; gold for the key and
// Major / Minor (decision 3 = a); a position colour as an underline, filled when chosen (decision 8 = a).
function Seg({ active, onClick, children, tone = "grey", pos = null, disabled = false, ...rest }) {
  const T = THEME;
  const fill = active ? (pos || (tone === "gold" ? T.sel : T.ctlHover)) : "transparent";
  const fg = active ? (pos ? T.ink : tone === "gold" ? T.onSel : T.text) : T.muted;
  const shadow = [active && `0 0 0 1.5px ${T.text}`, pos && !active && `inset 0 -3px 0 ${pos}`].filter(Boolean).join(", ") || "none";
  return (
    <button onClick={onClick} disabled={disabled} aria-disabled={disabled} className="text-sm transition-colors" {...rest}
      style={{ height: 30, padding: "0 12px", borderRadius: 4, opacity: disabled ? 0.5 : 1, cursor: disabled ? "default" : "pointer", backgroundColor: fill, color: fg, boxShadow: shadow, fontWeight: active ? 700 : 500, whiteSpace: "nowrap" }}>
      {children}
    </button>
  );
}
const Track = ({ children }) => <span className="track">{children}</span>;
// A labelled control row: one 92 px label column (UX-04). An empty label keeps the column.
const Row = ({ label = "", children, className = "" }) => <div className={"row " + className}><span className="rowlab">{label}</span>{children}</div>;
// A stand-alone button: tonal ctl with a 1 px edge (BR-03, decision 4 = a).
function Btn({ onClick, children }) {
  return <button onClick={onClick} className="text-sm transition-colors" style={{ height: 34, padding: "0 12px", borderRadius: 8, background: THEME.ctl, border: `1px solid ${THEME.edge}`, color: THEME.text, fontWeight: 500, whiteSpace: "nowrap" }}>{children}</button>;
}

// Window gap fill (SH-21, 22, 25 to 28, 30). In the lowest complete copy of window p, the layer's pitches run low to high;
// each pitch missing between the lowest and highest takes the nearest on-board cell outside the window, a tie going above.
// Returns keys s * 12 + (fret mod 12), so the fill repeats with the window 12 frets up or down, as inPos does.
const GAP_CACHE = new Map();
function gapCells(root, set, p) {
  const ivs = [...set].sort((a, b) => a - b);
  const id = `${root}|${ivs.join(",")}|${p.off}|${p.w}`;
  if (GAP_CACHE.has(id)) return GAP_CACHE.get(id);
  const base = (((root - 4 + p.off) % 12) + 12) % 12;
  const top = base + p.w;
  const inSet = (m) => set.has((((m - root) % 12) + 12) % 12);
  const have = new Set();
  for (let s = 0; s < 6; s++) for (let f = base; f <= top; f++) if (inSet(OPEN_ABS[s] + f)) have.add(OPEN_ABS[s] + f);
  const out = new Set();
  if (have.size) {
    const lo = Math.min(...have), hi = Math.max(...have);
    for (let m = lo + 1; m < hi; m++) {
      if (!inSet(m) || have.has(m)) continue;
      let best = null;
      for (let s = 0; s < 6; s++) {
        const f = m - OPEN_ABS[s];
        if (f < 0 || f > FRETS || (f >= base && f <= top)) continue;
        const d = f < base ? base - f : f - top;
        if (!best || d < best.d || (d === best.d && f > top)) best = { s, f, d };
      }
      if (best) out.add(best.s * 12 + (best.f % 12));
    }
  }
  GAP_CACHE.set(id, out);
  return out;
}

function Board({ cfg, update, globals }) {
  const { scope, arp, pos, focus, keyRoot, keyMode, arpMode, diaLabel, strGroup, mode } = cfg;
  const { labelMode, isolate, ghost, view } = globals;
  // Only the Arpeggio layer reads the chord root and quality; every other layer uses the key (UX-10).
  const root = scope === "arpeggio" ? cfg.root : keyRoot;
  const tonality = scope === "arpeggio" ? cfg.tonality : keyMode;
  // Quality kept on a key or layer change: a chosen Chord Quality if the key's list has it, else the tonic triad (UX-10, UX-11).
  const keyArp = (km) => (arpMode === "quality" && ARP_ALL(km).some(([k]) => k === arp) ? arp : "triad");
  const scopeSet = useMemo(() => new Set(scopeIntervals(tonality, scope, arp, mode)), [tonality, scope, arp, mode]);
  // Chord tones: every tone of the chord; in a scale layer, its 1, 3, 5 and 7 (TH-04).
  const ctSet = useMemo(() => {
    if (scope === "arpeggio") return scopeSet;
    const par = scope === "scale" ? scopeIntervals(tonality, scope, arp, mode) : MODE_IV[tonality === "major" ? "ionian" : "aeolian"];
    return new Set([par[0], par[2], par[4], par[6]].filter((iv) => scopeSet.has(iv)));
  }, [scope, scopeSet, tonality, arp, mode]);
  const posList = tonality === "major" ? POS_MAJOR : POS_MINOR;
  const interlock = pos === "all";
  const activePos = typeof pos === "number" ? posList.find((p) => p.num === pos) : null;
  // Gap fill applies to the Scale and Chord layers in a single position only; Pentatonic, Blues, Major and minor and All are unchanged.
  const gaps = useMemo(() => (activePos && (scope === "scale" || scope === "arpeggio") ? gapCells(root, scopeSet, activePos) : null), [activePos, scope, root, scopeSet]);
  // Focus keeps only degrees that can be lit in the current position, strings and Isolate; one that leaves is dropped (UX-13). Interlock ignores focus (UX-14).
  const litSet = new Set();
  for (let s = 0; s < 6; s++) for (let f = 0; f <= FRETS; f++) {
    const iv = (((OPEN[s] + f - root) % 12) + 12) % 12;
    if (scopeSet.has(iv) && (interlock || !isolate || ctSet.has(iv)) && (strGroup === null || (s >= strGroup && s <= strGroup + 2)) && (!activePos || inWin(s, f))) litSet.add(iv);
  }
  const activeFocus = interlock ? [] : focus.filter((iv) => litSet.has(iv));
  useEffect(() => { if (!interlock && activeFocus.length !== focus.length) update({ focus: activeFocus }); });
  const focusSet = new Set(activeFocus);
  const anyFocus = activeFocus.length > 0;
  // Degree names follow the scale or chord formula (TH-05); note names follow the key signature (TH-01).
  const degKey = scope === "scale" ? mode : scope === "arpeggio" ? arp : scope;
  const fdeg = (iv) => (DEG_OVERRIDE[degKey] && DEG_OVERRIDE[degKey][iv]) || DEG_LABEL[iv];
  const keySp = useMemo(() => keySpelling(keyRoot, keyMode), [keyRoot, keyMode]);
  const rootLetter = keySp[root] ? keySp[root].letter : LETTERS.indexOf(NOTES_FLAT[root][0]);
  const noteName = (pc) => {
    const iv = (((pc - root) % 12) + 12) % 12;
    if (!scopeSet.has(iv) && keySp[pc]) return keySp[pc].name;
    const d = /(\d)$/.exec(scopeSet.has(iv) ? fdeg(iv) : DEG_LABEL[iv]);
    return spellAt(rootLetter + (d ? +d[1] : 1) - 1, pc);
  };

  function inPos(f, p) {
    const base = (((root - 4 + p.off) % 12) + 12) % 12;
    return ((((f - base) % 12) + 12) % 12) <= p.w;
  }
  // A gap-fill cell counts as inside the active position.
  function inWin(s, f) { return inPos(f, activePos) || (gaps !== null && gaps.has(s * 12 + (f % 12))); }
  const phase = (f, p) => { const b = (((root - 4 + p.off) % 12) + 12) % 12; return ((((f - b) % 12) + 12) % 12); };

  const fit = view === "fit";
  const cellH = fit ? 34 : 46;
  const dotBig = fit ? 23 : 30;
  const dotBase = fit ? 18 : 24;
  const fontPx = 11; // nothing under 11 px (BR-05)
  const scaleColsPx = [64,60,56,53,50,47,44,41,39,37,35,33,31,29,27,25];
  const COLS = fit ? `22px ${scaleColsPx.map((n)=> n*0.62 + "px").join(" ")}` : `30px ${scaleColsPx.map((n)=> n + "px").join(" ")}`;

  const dotColorNormal = (iv) => (iv === 0 ? THEME.sel : MONO_GREY);
  const keyRel = scope === "arpeggio" && arpMode === "diatonic" && diaLabel === "key";
  const degLabel = (pc, iv) => {
    if (keyRel) {
      const ki = (((pc - keyRoot) % 12) + 12) % 12;
      return KEY_DEG[keyMode][ki] || (ki === 0 ? "1" : DEG_LABEL[ki]);
    }
    return fdeg(iv);
  };
  const labelOf = (pc, iv) => {
    if (labelMode === "name") return noteName(pc, root);
    if (labelMode !== "degree") return "";
    return degLabel(pc, iv);
  };

  const renderRow = (s) => {
    const cells = [];
    for (let f = 0; f <= FRETS; f++) {
      const pc = (OPEN[s] + f) % 12;
      const iv = ((pc - root) % 12 + 12) % 12;
      const inScope = scopeSet.has(iv);
      const isRoot = iv === 0;
      const isCT = ctSet.has(iv);
      let dim = false;
      if (strGroup !== null && (s < strGroup || s > strGroup + 2)) dim = true;
      if (!interlock) {
        if (activePos && !inWin(s, f)) dim = true;
        if (anyFocus && !focusSet.has(iv)) dim = true;
        if (isolate && !ctSet.has(iv)) dim = true;
      }
      let bg, splitB = null;
      if (interlock) {
        const hits = posList.filter((p) => inPos(f, p));
        if (hits.length === 0) bg = MONO_GREY;
        else if (hits.length === 1) bg = POS_COLOR[hits[0].letter];
        else {
          const ord = hits.slice().sort((a,b) => phase(f,b) - phase(f,a));
          bg = POS_COLOR[ord[0].letter]; splitB = POS_COLOR[ord[1].letter];
        }
      } else if (activePos) {
        bg = inWin(s, f) ? POS_COLOR[activePos.letter] : MONO_GREY;
      } else {
        bg = dotColorNormal(iv);
      }
      // Dark labels on gold and on every position colour, two-tone dots included (DS-04).
      const txt = bg === MONO_GREY ? THEME.text : bg === THEME.sel ? THEME.onSel : THEME.ink;
      const sz = isRoot || isCT ? dotBig : dotBase;
      const dotBg = splitB ? `linear-gradient(135deg, ${bg} 0 50%, ${splitB} 50% 100%)` : bg;
      cells.push(
        <div key={f} className="relative flex items-center justify-center" style={{ height: cellH, borderRight: f === 0 ? `5px solid ${THEME.nut}` : `2px solid ${THEME.line}`, background: f === 0 ? THEME.track : undefined }}>
          <div className="absolute left-0 right-0" style={{ top: "50%", transform: "translateY(-50%)", height: STRING_GAUGE[s], background: THEME.edge }} />
          {inScope && (isRoot ? (
            <button disabled={interlock} onClick={() => update({ focus: toggle(activeFocus, iv) })} className="relative rounded-full flex items-center justify-center transition-all" style={{ width: sz+8, height: sz+8, background: dotBg, opacity: dim ? 0.16 : 1, zIndex: 5, cursor: interlock ? "default" : "pointer" }} title={`${noteName(pc)} · ${fdeg(iv)}`}>
              <div className="rounded-full flex items-center justify-center" style={{ width: sz, height: sz, background: dotBg, border: `2px solid ${THEME.bg}`, color: txt, fontSize: fontPx, fontWeight: 800 }}>{labelOf(pc, iv)}</div>
            </button>
          ) : (
            <button disabled={interlock} onClick={() => update({ focus: toggle(activeFocus, iv) })} className="relative rounded-full flex items-center justify-center transition-all" style={{ width: sz, height: sz, fontSize: fontPx, fontWeight: isCT ? 800 : 500, color: txt, background: dotBg, opacity: dim ? 0.16 : 1, zIndex: isCT ? 3 : 2, cursor: interlock ? "default" : "pointer" }} title={`${noteName(pc)} · ${fdeg(iv)}`}>{labelOf(pc, iv)}</button>
          ))}
          {!inScope && ghost && (
            <div className="absolute rounded-full flex items-center justify-center" style={{ width: fit ? 18 : 23, height: fit ? 18 : 23, background: THEME.track, border: `1px solid ${THEME.line}`, color: THEME.muted, fontSize: 11, fontWeight: 600, opacity: dim ? 0.16 : 1, zIndex: 1 }} title={noteName(pc, root)}>{labelOf(pc, iv)}</div>
          )}
        </div>
      );
    }
    return (
      <div key={s} className="contents">
        <div className="flex items-center justify-center text-xs font-semibold text-muted" style={{ height: cellH }}>{STRING_LABELS[s]}</div>
        {cells}
      </div>
    );
  };

  const degrees = [...scopeSet].sort((a,b) => a-b);
  // One plain summary line (UX-07): "G7", "B diminished", "A minor pentatonic".
  const rootName = noteName(root, root);
  const summary = scope === "arpeggio"
    ? (arp === "triad" ? `${rootName} ${tonality}` : arp === "dim" ? `${rootName} diminished` : arp === "aug" ? `${rootName} augmented` : rootName + QUAL_NAME[arp])
    : scope === "scale" ? `${rootName} ${MODE_NAME[mode]}`
    : scope === "blended" ? `${rootName} major and minor pentatonic`
    : `${rootName} ${tonality} ${scope}`;

  return (
    <div>
      <div data-summary className="text-sm font-semibold text-body mb-2">{summary}</div>

      <Row label="Key" className="mb-2">
        <Track>{NOTES_SHARP.map((n,i) => <Seg key={i} tone="gold" active={keyRoot === i} onClick={() => update({ root: i, keyRoot: i, tonality: keyMode, arp: keyArp(keyMode) })}>{KEY_NAME[keyMode][i]}</Seg>)}</Track>
      </Row>

      <Row className="mb-3">
        <Track>{[["major","Major"],["minor","Minor"]].map(([t,l]) => <Seg key={t} tone="gold" active={keyMode === t} onClick={() => update({ keyMode: t, tonality: t, root: keyRoot, arp: "triad", mode: t === "major" ? "ionian" : "aeolian" })}>{l}</Seg>)}</Track>
      </Row>

      <Row label="Show" className="mb-3">
        <Track>{[["arpeggio","Chord"],["pentatonic","Pentatonic"],["blues","Blues"],["scale","Scale"],["blended","Major and minor"]].map(([k,l]) => <Seg key={k} active={scope === k} onClick={() => update(k === "arpeggio" ? { scope: k } : { scope: k, root: keyRoot, tonality: keyMode, arp: keyArp(keyMode) })}>{l}</Seg>)}</Track>
      </Row>

      <div>
        {scope === "arpeggio" && (
          <div className="flex flex-col gap-2 mb-3">
            <Row label="Chord">
              <Track>
                <Seg active={arpMode === "diatonic"} onClick={() => update({ arpMode: "diatonic", arp: "triad" })}>In key</Seg>
                <Seg active={arpMode === "quality"} onClick={() => update({ arpMode: "quality" })}>Any chord</Seg>
              </Track>
            </Row>
            {arpMode === "diatonic" ? (
              <React.Fragment>
                <Row>
                  <Track>{DIATONIC[keyMode].map(([rn,off,q]) => {
                    const cr = (keyRoot + off) % 12;
                    const active = root === cr;
                    return <Seg key={rn} active={active} onClick={() => update({ root: cr, tonality: q === "maj" ? "major" : "minor", arp: q === "dim" ? "dim" : "triad" })}>{rn}</Seg>;
                  })}</Track>
                </Row>
                <Row label="Numbers from">
                  <Track>
                    <Seg active={diaLabel === "key"} onClick={() => update({ diaLabel: "key" })}>Key</Seg>
                    <Seg active={diaLabel === "chord"} onClick={() => update({ diaLabel: "chord" })}>Chord</Seg>
                  </Track>
                </Row>
              </React.Fragment>
            ) : (
              ARP_QUAL[tonality].map(([group, qs]) => (
                <Row key={group} label={group}>
                  <Track>{qs.map(([k,l]) => <Seg key={k} active={arp === k} onClick={() => update({ arp: k })}>{l}</Seg>)}</Track>
                </Row>
              ))
            )}
          </div>
        )}
        {scope === "scale" && (
          <Row label="Scale" className="mb-3">
            <Track>{MODES[tonality].map(([k,l]) => <Seg key={k} active={mode === k} onClick={() => update({ mode: k })}>{l}</Seg>)}</Track>
          </Row>
        )}
      </div>

      <div className={fit ? "rounded-xl pb-2" : "overflow-x-auto pb-2 rounded-xl"} style={{ background: THEME.panel2 }}>
        <div className="grid p-3" style={{ gridTemplateColumns: COLS, width: fit ? "100%" : undefined, minWidth: fit ? undefined : "fit-content" }}>
          {[0,1,2,3,4,5].map(renderRow)}
          <div />
          {/* Fret numbers: muted; marker frets bold in text. The marker-dot row is gone (DS-07). */}
          {Array.from({ length: FRETS + 1 }, (_, f) => (
            <div key={"n" + f} className="flex items-center justify-center text-xs" style={{ height: 24, color: MARKERS[f] ? THEME.text : THEME.muted, fontWeight: MARKERS[f] ? 700 : 400 }}>{f}</div>
          ))}
        </div>
      </div>

      <Row label="Position" className="mt-3 mb-2">
        <Track>
          <Seg active={pos === null} onClick={() => update({ pos: null })}>Off</Seg>
          {posList.map((p) => <Seg key={p.num} active={pos === p.num} onClick={() => update({ pos: p.num })} pos={POS_COLOR[p.letter]}>{p.num} {p.letter}</Seg>)}
          <Seg active={interlock} onClick={() => update({ pos: "all" })}>All</Seg>
        </Track>
      </Row>

      <Row label="Strings" className="mb-2">
        <Track>
          <Seg active={strGroup === null} onClick={() => update({ strGroup: null })}>All</Seg>
          {[[0,"1–3"],[1,"2–4"],[2,"3–5"],[3,"4–6"]].map(([g,l]) => (
            <Seg key={g} active={strGroup === g} onClick={() => update({ strGroup: g })}>{l}</Seg>
          ))}
        </Track>
      </Row>

      {interlock ? (
        <Row className="mt-3">
          <div className="flex flex-wrap gap-2 items-center" style={{ minHeight: 34 }}>
            {posList.slice().sort((a,b) => a.num - b.num).map((p) => (
              <div key={p.num} className="flex items-center gap-2 px-2 py-1 rounded-lg text-xs font-semibold" style={{ background: THEME.track }}>
                <span className="rounded-full" style={{ width: 12, height: 12, background: POS_COLOR[p.letter] }} />
                <span className="text-body">{p.num} {p.letter}</span>
              </div>
            ))}
          </div>
        </Row>
      ) : (
        <Row label="Focus" className="mt-3">
          <div className="flex flex-wrap gap-2 items-center" style={{ minHeight: 34 }}>
            {degrees.map((iv) => {
              const focused = focusSet.has(iv);
              const ct = ctSet.has(iv);
              const off = !litSet.has(iv);
              const quiet = anyFocus && !focused;
              return (
                <button key={iv} disabled={off} aria-disabled={off} onClick={() => update({ focus: toggle(activeFocus, iv) })} className="flex items-center gap-2 px-2 rounded-lg text-xs" style={{ height: 30, border: `1px solid ${focused ? "transparent" : THEME.edge}`, background: focused ? THEME.ctlHover : quiet ? "transparent" : THEME.ctl, boxShadow: focused ? `0 0 0 1.5px ${THEME.text}` : "none", opacity: off ? 0.5 : 1, cursor: off ? "default" : "pointer", fontWeight: ct ? 800 : 500 }}>
                  <span className="rounded-full" style={{ width: 12, height: 12, background: dotColorNormal(iv), boxShadow: iv === 0 ? `0 0 0 1.5px ${THEME.text}` : "none" }} />
                  <span className="text-body">{degLabel((root + iv) % 12, iv)}</span>
                  <span className="text-muted">{noteName((root + iv) % 12, root)}</span>
                </button>
              );
            })}
            {anyFocus && <button onClick={() => update({ focus: [] })} className="text-xs text-link underline" style={{ minHeight: 30, padding: "0 4px" }}>Clear</button>}
          </div>
        </Row>
      )}
    </div>
  );
}

function InfoTab() {
  const H = ({ children }) => <h3 className="text-sm font-bold text-body" style={{ margin: "16px 0 4px" }}>{children}</h3>;
  const P = ({ children }) => <p className="text-sm text-body" style={{ margin: "0 0 8px", lineHeight: 1.5 }}>{children}</p>;
  // Written from the v0.22 build (CP-01, CP-04): thing-first, no second person.
  return (
    <div className="p-3 rounded-lg" style={{ background: THEME.panel, maxWidth: 760 }}>
      <P>Scales, chords and the five CAGED positions on a standard-tuned (EADGBE) neck, frets 0–15.</P>
      <H>Trainer</H>
      <P><b>Key.</b> The 12 roots with Major or Minor. Note names follow the key signature; notes outside the key are spelled from the chord or scale formula (C dim7: C Eb Gb Bbb).</P>
      <P><b>Show.</b> Chord: the chord tones only. Pentatonic: the major or minor pentatonic. Blues: the pentatonic with the blue note (♭3 in major, ♭5 in minor). Scale: seven-note scales. Major and minor: both pentatonics together (1 2 ♭3 3 4 5 6 ♭7).</P>
      <P><b>Chord → In key.</b> The seven chords of the key: I ii iii IV V vi vii° in major; i ii° III iv v VI ♭VII in minor (natural minor). Numbers count from the key or from the chord. Key numbers in a minor key are 1 2 ♭3 4 5 ♭6 ♭7.</P>
      <P><b>Chord → Any chord.</b> Triads, sevenths and added-note chords on the current chord root. The list follows whether that chord is major or minor.</P>
      <P><b>Scale.</b> Major keys: Ionian, Lydian, Mixolydian. Minor keys: Aeolian, Dorian, Phrygian, harmonic minor, melodic minor.</P>
      <P><b>Position.</b> The five CAGED positions, 1 C to 5 D. One position dims the notes outside it. All shows the five together; a note shared by two neighbouring positions is split two-tone. In All, dots cannot be tapped and Focus and Notes: Chord tones are unavailable.</P>
      <P><b>Strings.</b> Limits the board to one three-string set, 1–3 to 4–6.</P>
      <P><b>Focus.</b> A tap on a dot or a Focus chip keeps that degree and dims the rest. More taps add degrees; a second tap releases one; Clear releases all. A degree that cannot be lit under the current position, strings or Notes setting is unavailable.</P>
      <P><b>Dots.</b> Chord tones are larger and bold. The root is ringed: gold with no position, the position colour in a position or in All.</P>
      <P><b>Quick start.</b> Four set-ups: all five positions, chord tones in the scale, the ♭7 of a dominant 7th, and chords in the key. Each also sets the Display options.</P>
      <H>Display</H>
      <P><b>Labels.</b> Degrees, note names or none.</P>
      <P><b>View.</b> Scroll keeps full-size frets and scrolls sideways. Fit narrows the frets.</P>
      <P><b>Notes.</b> Chord tones dims every other note. In Chord, every tone of the chord counts; in Scale, its 1, 3, 5 and 7; in Pentatonic, Blues and Major and minor, the 1, 3, 5 and 7 of the key's scale where present.</P>
      <P><b>Other notes.</b> Shown adds faint markers for the notes outside the current set.</P>
      <H>Reference</H>
      <P>Not built yet.</P>
      <p className="text-xs text-muted" style={{ margin: "16px 0 0" }}>Fretboard Trainer {VERSION}</p>
    </div>
  );
}

function FretboardTrainer() {
  const [labelMode, setLabelMode] = useState("degree");
  const [isolate, setIsolate] = useState(false);
  const [ghost, setGhost] = useState(false);
  const [view, setView] = useState("scroll");
  const [tab, setTab] = useState("trainer");
  const [cfg, setCfg] = useState({ root: 0, tonality: "major", scope: "pentatonic", arp: "triad", pos: null, focus: [], keyRoot: 0, keyMode: "major", arpMode: "diatonic", diaLabel: "key", strGroup: null, mode: "ionian" });
  const globals = { labelMode, isolate, ghost, view };
  const up = (p) => setCfg((c) => ({ ...c, ...p }));

  const applyPreset = (p) => {
    if (p === "interlock") {
      setCfg((c) => ({ ...c, scope: "pentatonic", pos: "all", focus: [] }));
      setIsolate(false); setView("fit"); setGhost(false); setLabelMode("degree");
    } else if (p === "chordtones") {
      setCfg((c) => ({ ...c, scope: "scale", pos: null, focus: [] }));
      setIsolate(true); setView("scroll"); setGhost(false); setLabelMode("degree");
    } else if (p === "dom7") {
      setCfg((c) => ({ ...c, scope: "arpeggio", arpMode: "quality", arp: "dom7", tonality: "major", keyMode: "major", root: c.keyRoot, pos: null, focus: [10] }));
      setIsolate(false); setView("scroll"); setGhost(false); setLabelMode("degree");
    } else if (p === "walk") {
      setCfg((c) => ({ ...c, scope: "arpeggio", arpMode: "diatonic", diaLabel: "key", arp: "triad", tonality: c.keyMode, root: c.keyRoot, pos: null, focus: [] }));
      setIsolate(false); setView("fit"); setGhost(false); setLabelMode("degree");
    }
  };

  return (
    <div className="w-full" style={{ background: THEME.bg, color: THEME.text }}>
      <div className="p-4">
      {/* Plain text title (decision 15 = a); the rust bar, badge and subtitle are gone (BR-01, BR-08, CP-02). */}
      <h1 className="text-xl font-bold text-body" style={{ margin: "0 0 12px" }}>Fretboard Trainer</h1>

      <div className="mb-4" role="tablist">
        <Track>
          {TABS.map(([k,l]) => <Seg key={k} role="tab" aria-selected={tab === k} active={tab === k} onClick={() => setTab(k)}>{l}</Seg>)}
        </Track>
      </div>

      {tab === "trainer" && (<React.Fragment>
      <div className="flex flex-wrap gap-2 mb-3 items-center p-2 rounded-lg" style={{ background: THEME.panel }}>
        <span className="text-xs text-muted mr-1">Quick start</span>
        <Btn onClick={() => applyPreset("interlock")}>All five positions</Btn>
        <Btn onClick={() => applyPreset("chordtones")}>Chord tones in the scale</Btn>
        <Btn onClick={() => applyPreset("dom7")}>♭7 of a dominant 7th</Btn>
        <Btn onClick={() => applyPreset("walk")}>Chords in the key</Btn>
      </div>

      <Board cfg={cfg} update={up} globals={globals} />
      </React.Fragment>)}

      {tab === "display" && (
      <div className="flex flex-col gap-2 p-2 rounded-lg" style={{ background: THEME.panel }}>
        <Row label="Labels">
          <Track>{[["degree","Degrees"],["name","Notes"],["none","None"]].map(([k,l]) => <Seg key={k} active={labelMode === k} onClick={() => setLabelMode(k)}>{l}</Seg>)}</Track>
        </Row>
        <Row label="View">
          <Track>{[["scroll","Scroll"],["fit","Fit"]].map(([k,l]) => <Seg key={k} active={view === k} onClick={() => setView(k)}>{l}</Seg>)}</Track>
        </Row>
        {/* Was the Isolate chord tones toggle: same state, unavailable in All (Interlock). */}
        <Row label="Notes">
          <Track>
            <Seg active={!isolate || cfg.pos === "all"} disabled={cfg.pos === "all"} onClick={() => setIsolate(false)}>All</Seg>
            <Seg active={isolate && cfg.pos !== "all"} disabled={cfg.pos === "all"} onClick={() => setIsolate(true)}>Chord tones</Seg>
          </Track>
        </Row>
        {/* Was the Show chromatic toggle. */}
        <Row label="Other notes">
          <Track>
            <Seg active={!ghost} onClick={() => setGhost(false)}>Hidden</Seg>
            <Seg active={ghost} onClick={() => setGhost(true)}>Shown</Seg>
          </Track>
        </Row>
      </div>
      )}

      {tab === "reference" && (
        <p className="text-sm text-muted">Reference: not built yet.</p>
      )}

      {tab === "info" && <InfoTab />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FretboardTrainer />);
</script>
</body>
</html>
