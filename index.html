<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;
const VERSION = "v0.27";
document.title = `Fretboard Trainer · ${VERSION}`;

// ChordCharts Dark tokens (BR-01). Colour roles (BR-02): gold = the key, CAGED = position, greyscale = everything else.
const THEME = { bg:"#0D131A", panel:"#141C25", panel2:"#1B2530", track:"#091017", ctl:"#2A3645", ctlHover:"#344253", edge:"#6C7C8E", line:"#334252", text:"#E3E9F0", muted:"#A9B6C4", sel:"#E8C66E", onSel:"#16120A", ink:"#16232F", nut:"#C5D0DC", link:"#9CC6EE" };

const NOTES_SHARP = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTES_FLAT  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
// Key names per tonality; minor keys use the common spellings (C♯, G♯ minor rather than D♭, A♭ minor).
const KEY_NAME = {
  major: ["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"],
  minor: ["C","C#","D","Eb","E","F","F#","G","G#","A","Bb","B"],
};
const LETTERS = ["C","D","E","F","G","A","B"];
const LETTER_PC = [0,2,4,5,7,9,11];
const OPEN = [4,11,7,2,9,4];
const OPEN_ABS = [64,59,55,50,45,40]; // e4 B3 G3 D3 A2 E2 as MIDI numbers, for pitch order across strings
const STRING_LABELS = ["e","B","G","D","A","E"];
const STRING_GAUGE = [1.2,1.6,2.1,2.6,3.2,3.8];
const FRETS = 21;
const MARKERS = {3:1,5:1,7:1,9:1,12:2,15:1,17:1,19:1,21:1};
// Column widths at full size: the open column, then frets 1–21 tapering 60 → 34 px, so a 30 px dot fits every fret.
// Each column is minmax(w px, w fr): the neck fills the width when that fits and scrolls at full size below it (RS-01).
const COL_PX = [64, ...Array.from({ length: FRETS }, (_, i) => Math.round(60 * Math.pow(34 / 60, i / (FRETS - 1))))];

const DEG_LABEL = {0:"R",1:"♭2",2:"2",3:"♭3",4:"3",5:"4",6:"♭5",7:"5",8:"♭6",9:"6",10:"♭7",11:"7"};
// Neutral dots (DS-05): a value step, chord tones light and other scale tones muted, both with ink labels.
const NEUTRAL_CT = "#E3E9F0", NEUTRAL_OTHER = "#A9B6C4";
// Degrees the formula names differently from the semitone default (TH-05). Keys: scale mode or chord quality.
const DEG_OVERRIDE = { lydian: {6:"♯4"}, aug: {8:"♯5"}, aug7: {8:"♯5"}, dim7: {9:"𝄫7"} };

// Grouped as Triads, Sevenths, Added notes (UX-04); the same qualities per tonality as v0.21.
const ARP_QUAL = {
  major: [
    ["Triads", [["triad","Triad"],["sus2","sus2"],["sus4","sus4"],["aug","aug"],["dim","dim"]]],
    ["Sevenths", [["maj7","maj7"],["dom7","7"],["7sus4","7sus4"],["aug7","aug7"],["m7b5","m7♭5"],["dim7","dim7"]]],
    ["Added notes", [["add9","add9"],["add11","add11"],["add13","6"]]],
  ],
  minor: [
    ["Triads", [["triad","Triad"],["sus2","sus2"],["sus4","sus4"],["dim","dim"]]],
    ["Sevenths", [["min7","m7"],["7sus4","7sus4"],["m7b5","m7♭5"],["dim7","dim7"]]],
    ["Added notes", [["madd9","add9"],["madd11","add11"],["m6","6"]]],
  ],
};
const ARP_ALL = (t) => ARP_QUAL[t].flatMap(([, qs]) => qs);
// Header summary names (UX-07).
const QUAL_NAME = { maj7:"maj7", dom7:"7", min7:"m7", m7b5:"m7♭5", dim7:"dim7", aug7:"aug7", add9:"add9", add11:"add11", add13:"6", m6:"m6", madd9:"m(add9)", madd11:"m(add11)", sus2:"sus2", sus4:"sus4", "7sus4":"7sus4" };
const MODE_NAME = { ionian:"Ionian", dorian:"Dorian", phrygian:"Phrygian", lydian:"Lydian", mixolydian:"Mixolydian", aeolian:"Aeolian", locrian:"Locrian", harmonic:"harmonic minor", melodic:"melodic minor" };

const DIATONIC = {
  major: [["I",0,"maj"],["ii",2,"min"],["iii",4,"min"],["IV",5,"maj"],["V",7,"maj"],["vi",9,"min"],["vii°",11,"dim"]],
  minor: [["i",0,"min"],["ii°",2,"dim"],["III",3,"maj"],["iv",5,"min"],["v",7,"min"],["VI",8,"maj"],["♭VII",10,"maj"]],
};

const KEY_DEG = {
  major: { 0: "1", 2: "2", 4: "3", 5: "4", 7: "5", 9: "6", 11: "7" },
  minor: { 0: "1", 2: "2", 3: "♭3", 5: "4", 7: "5", 8: "♭6", 10: "♭7" },
};

// The seven modes of major in parent order (IA-review decision 4), in any key, numbered from the mode root; harmonic and
// melodic minor under Other scales. A mode sets Major or Minor by its 3rd (Round 4b), so windows and chord tones follow it.
const MODES = [["ionian","Ionian"],["dorian","Dorian"],["phrygian","Phrygian"],["lydian","Lydian"],["mixolydian","Mixolydian"],["aeolian","Aeolian"],["locrian","Locrian"]];
const OTHER_SCALES = [["harmonic","Harmonic minor"],["melodic","Melodic minor"]];
const MODE_IV = {
  ionian: [0,2,4,5,7,9,11], lydian: [0,2,4,6,7,9,11], mixolydian: [0,2,4,5,7,9,10],
  aeolian: [0,2,3,5,7,8,10], dorian: [0,2,3,5,7,9,10], phrygian: [0,1,3,5,7,8,10], locrian: [0,1,3,5,6,8,10],
  harmonic: [0,2,3,5,7,8,11], melodic: [0,2,3,5,7,9,11],
};
const MODE_Q = (m) => (MODE_IV[m][2] === 4 ? "major" : "minor");

// Calmer CAGED set (decision 7 = b), all with ink labels (DS-04).
const POS_COLOR = {C:"#E5766B",A:"#E9A15C",G:"#DDD05A",E:"#7FA8E6",D:"#7CC68D"};
// Nut-substitute hatch: the second stripe per position colour, 1.5:1 against it; ink labels stay at 4.6:1 or more on both stripes.
const HATCH = {C:"#efa9a2",A:"#bb834e",G:"#b3aa4d",E:"#b6cdf1",D:"#c5e6cd"};
const POS_MAJOR = [{num:1,letter:"C",off:4,w:3},{num:2,letter:"A",off:6,w:3},{num:3,letter:"G",off:9,w:3},{num:4,letter:"E",off:-1,w:3},{num:5,letter:"D",off:1,w:4}];
const POS_MINOR = [{num:1,letter:"C",off:4,w:4},{num:2,letter:"A",off:7,w:3},{num:3,letter:"G",off:9,w:3},{num:4,letter:"E",off:0,w:3},{num:5,letter:"D",off:2,w:3}];

function scopeIntervals(t, scope, arp, mode) {
  if (scope === "arpeggio") {
    if (arp === "maj7") return [0,4,7,11];
    if (arp === "dom7") return [0,4,7,10];
    if (arp === "min7") return [0,3,7,10];
    if (arp === "m7b5") return [0,3,6,10];
    if (arp === "dim") return [0,3,6];
    if (arp === "dim7") return [0,3,6,9];
    if (arp === "aug") return [0,4,8];
    if (arp === "aug7") return [0,4,8,10];
    if (arp === "add9") return [0,4,7,2];
    if (arp === "add11") return [0,4,7,5];
    if (arp === "add13") return [0,4,7,9];
    if (arp === "m6") return [0,3,7,9];
    if (arp === "madd9") return [0,3,7,2];
    if (arp === "madd11") return [0,3,7,5];
    if (arp === "sus2") return [0,2,7];
    if (arp === "sus4") return [0,5,7];
    if (arp === "7sus4") return [0,5,7,10];
    return t === "major" ? [0,4,7] : [0,3,7];
  }
  if (scope === "pentatonic") return t === "major" ? [0,2,4,7,9] : [0,3,5,7,10];
  if (scope === "blues") return t === "major" ? [0,2,3,4,7,9] : [0,3,5,6,7,10];
  if (scope === "scale") return MODE_IV[mode] || (t === "major" ? [0,2,4,5,7,9,11] : [0,2,3,5,7,8,10]);
  return [0,2,3,4,5,7,9,10];
}
const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
// Letter index li (0 = C, wraps) plus the accidental that reaches pitch class pc.
const spellAt = (li, pc) => {
  const l = ((li % 7) + 7) % 7;
  let d = (((pc - LETTER_PC[l]) % 12) + 12) % 12;
  if (d > 6) d -= 12;
  return LETTERS[l] + (d > 0 ? "#".repeat(d) : "b".repeat(-d));
};
// The seven notes of the key (Ionian or Aeolian), spelled from the key signature (TH-01).
function keySpelling(keyRoot, keyMode) {
  const li = LETTERS.indexOf(KEY_NAME[keyMode][keyRoot][0]);
  const map = {};
  MODE_IV[keyMode === "major" ? "ionian" : "aeolian"].forEach((s, k) => {

      for (let k = 12; top + k <= FRETS; k += 12) {

// Nut substitutes. A cell of the window's lower copy (12 frets down, gap fill included) that falls below the nut is played at
// the same pitch on the next lower string, where that cell is not already in the window; the low E string has none.

function Board({ cfg, update, globals }) {

            Major / Minor goes back to Ionian or Aeolian unless the chosen mode already has that 3rd (Round 4b). */}
        <Row>
          <Track label="Key" cols={6}>{NOTES_SHARP.map((n,i) => <Seg key={i} tone="gold" active={keyRoot === i} onClick={() => update({ root: i, keyRoot: i, tonality: keyMode, arp: keyArp(keyMode) })}>{KEY_NAME[keyMode][i]}</Seg>)}</Track>
        </Row>
        <Row>
          <Track label="Major or minor" cols={2}>{[["major","Major"],["minor","Minor"]].map(([t,l]) => <Seg key={t} tone="gold" active={keyMode === t} onClick={() => update({ keyMode: t, tonality: t, root: keyRoot, arp: "triad", mode: keyMode === t && MODE_Q(mode) === t ? mode : t === "major" ? "ionian" : "aeolian" })}>{l}</Seg>)}</Track>
        </Row>
      </Card>

      <Card title="Show">
      {/* Show as four equal cells; the sub-panel hangs off the chosen cell (caret, inset surface) and is titled with the
          resolved name, "C Dorian" or "C major pentatonic" (IA-review, mock-up C). Blues has the title only. */}
      <div>
      <Row>
        {/* Major and minor is an option under Pentatonic, not a fifth layer (feature table). */}
        <Track label="Show" cols={4}>{[["arpeggio","Chord"],["pentatonic","Pentatonic"],["blues","Blues"],["scale","Scale"]].map(([k,l]) => {
          const on = scope === k || (k === "pentatonic" && scope === "blended");
          return <Seg key={k} active={on} aria-controls="show-panel" onClick={() => { if (!on) update(k === "arpeggio" ? { scope: k } : toKey(k)); }}>{l}{on && <span aria-hidden="true" className="caret" />}</Seg>;
        })}</Track>
      </Row>

      <div id="show-panel" className="subpanel" role="group" aria-labelledby="show-title">
        <h3 id="show-title">{summary}</h3>
        {(scope === "pentatonic" || scope === "blended") && (
          <Row label="Pentatonic">
            <Track label="Pentatonic">
              <Seg active={scope === "pentatonic"} onClick={() => update(toKey("pentatonic"))}>{keyMode === "major" ? "Major" : "Minor"}</Seg>
              <Seg active={scope === "blended"} onClick={() => update(toKey("blended"))}>Major and minor</Seg>
            </Track>
          </Row>
        )}
        {scope === "arpeggio" && (
          <div className="flex flex-col gap-2">
            <Row label="Chord">
              <Track label="Chord">
                <Seg active={arpMode === "diatonic"} onClick={() => update({ arpMode: "diatonic", arp: "triad" })}>In key</Seg>
                <Seg active={arpMode === "quality"} onClick={() => update({ arpMode: "quality" })}>Any chord</Seg>
              </Track>
            </Row>
            {arpMode === "diatonic" ? (
              <React.Fragment>
                <Row>
                  <Track label="Chords in the key">{DIATONIC[keyMode].map(([rn,off,q]) => {
                    const cr = (keyRoot + off) % 12;
                    const active = root === cr;
                    return <Seg key={rn} active={active} onClick={() => update({ root: cr, tonality: q === "maj" ? "major" : "minor", arp: q === "dim" ? "dim" : "triad" })}>{rn}</Seg>;
                  })}</Track>
                </Row>
                <Row label="Numbers from">
                  <Track label="Numbers from">
                    <Seg active={diaLabel === "key"} onClick={() => update({ diaLabel: "key" })}>Key</Seg>
                    <Seg active={diaLabel === "chord"} onClick={() => update({ diaLabel: "chord" })}>Chord</Seg>
                  </Track>
                </Row>
              </React.Fragment>
            ) : (
              ARP_QUAL[tonality].map(([group, qs]) => (
                <Row key={group} label={group}>
                  <Track label={group}>{qs.map(([k,l]) => <Seg key={k} active={arp === k} onClick={() => update({ arp: k })}>{l}</Seg>)}</Track>
                </Row>
              ))
            )}
          </div>
        )}
        {/* All seven modes in any key; a mode with the other 3rd switches Major / Minor (Round 4b). */}
        {scope === "scale" && [["Mode", MODES, 4], ["Other scales", OTHER_SCALES, 2]].map(([lab, list, n]) => (
          <Row key={lab} label={lab}>
            <Track label={lab} cols={n}>{list.map(([k,l]) => <Seg key={k} active={mode === k} onClick={() => {
              const q = MODE_Q(k);
              update(q === keyMode ? { mode: k } : { mode: k, keyMode: q, tonality: q, root: keyRoot, arp: "triad" });
            }}>{l}</Seg>)}</Track>
          </Row>
        ))}
      </div>
      </div>
      </Card>

      <Card title="Filter">
      <Row label="Position">
        {/* Seven equal cells on one row: the shape letter as the label, its number small, the colour as the underline (mock-up C).
            The number is 11 px, the floor (BR-05); the accessible name stays "1 C". */}
        <Track label="Position" cols={7}>
          <Seg active={pos === null} onClick={() => update({ pos: null })}>Off</Seg>
          {posList.map((p) => <Seg key={p.num} active={pos === p.num} onClick={() => update({ pos: p.num })} pos={POS_COLOR[p.letter]} aria-label={`${p.num} ${p.letter}`}><span aria-hidden="true" style={{ fontSize: 11, fontWeight: 500, marginRight: 3 }}>{p.num}</span>{p.letter}</Seg>)}
          <Seg active={interlock} onClick={() => update({ pos: "all" })}>All</Seg>
        </Track>
      </Row>

      <Row label="Strings">
        <Track label="Strings" cols={5}>
          <Seg active={strGroup === null} onClick={() => update({ strGroup: null })}>All</Seg>
          {[[0,"1–3"],[1,"2–4"],[2,"3–5"],[3,"4–6"]].map(([g,l]) => (
            <Seg key={g} active={strGroup === g} onClick={() => update({ strGroup: g })}>{l}</Seg>
          ))}
        </Track>
      </Row>

      {/* Was the Isolate chord tones toggle: same state, unavailable in All (IA-01). */}
      <Row label="Notes">
        <Track label="Notes">
          <Seg active={!isolate || interlock} disabled={interlock} onClick={() => setIsolate(false)}>All</Seg>
          <Seg active={isolate && !interlock} disabled={interlock} onClick={() => setIsolate(true)}>Chord tones</Seg>
        </Track>
      </Row>

      {/* Focus chips: degree and note only, chord tones bold (DS-08). The All legend is gone: the Position buttons and the
          ruler name the positions. In All the chips are unavailable, like Notes. */}
      <Row label="Focus">
        <div className="flex flex-wrap gap-2 items-center" role="group" aria-label="Focus">
          {degrees.map((iv) => {
            const focused = focusSet.has(iv);
            const ct = ctSet.has(iv);
            const off = interlock || !litSet.has(iv);
            const quiet = anyFocus && !focused;
            return (
              <button key={iv} disabled={off} aria-disabled={off} aria-pressed={focused} onClick={() => update({ focus: toggle(activeFocus, iv) })} className="chip flex items-center gap-2 px-2 rounded-lg text-xs" style={{ border: `1px solid ${focused ? "transparent" : THEME.edge}`, background: focused ? THEME.ctlHover : quiet ? "transparent" : THEME.ctl, boxShadow: focused ? `0 0 0 1.5px ${THEME.text}` : "none", opacity: off ? 0.5 : 1, cursor: off ? "default" : "pointer", fontWeight: ct ? 800 : 500 }}>
                <span className="text-body">{degLabel((root + iv) % 12, iv)}</span>
                <span className="text-muted">{noteName((root + iv) % 12, root)}</span>
              </button>
            );
          })}
        </div>
      </Row>
      </Card>

      {/* Display beside the other groups, with the board on screen (IA-01, decision 2 = b). */}
      <Card title="Display">
        <Row label="Labels">
          <Track label="Labels">{[["degree","Degrees"],["name","Notes"],["none","None"]].map(([k,l]) => <Seg key={k} active={labelMode === k} onClick={() => setLabelMode(k)}>{l}</Seg>)}</Track>
        </Row>
        <Row label="Other notes">
          <Track label="Other notes">
            <Seg active={!ghost} onClick={() => setGhost(false)}>Hidden</Seg>
            <Seg active={ghost} onClick={() => setGhost(true)}>Shown</Seg>
          </Track>
        </Row>
      </Card>
      </div>
    </div>
  );
}

// Help, opened from the head (IA-02, decision 2 = b). Examples set trainer state only (UX-06, UX-15, decision 13 = a).
function Help({ onExample }) {
  const H = ({ children }) => <h2 className="text-sm font-bold text-body" style={{ margin: "16px 0 4px" }}>{children}</h2>;
  const P = ({ children }) => <p className="text-sm text-body" style={{ margin: "0 0 8px", lineHeight: 1.5 }}>{children}</p>;
  // Written from the v0.27 build (CP-01, CP-04): thing-first, no second person.
  return (
    <div className="p-3 rounded-lg" style={{ background: THEME.panel, maxWidth: 760 }}>
      <P>Scales, chords and the five CAGED positions on a standard-tuned (EADGBE) neck, frets 0–21. The board comes first, with a summary line above it; the controls sit in four groups below: Key, Show, Filter and Display. The head switches between three pages: Neck (this trainer), Chords and Modes; Chords and Modes are still being built.</P>
      <H>Key and Show</H>
      <P><b>Key.</b> The 12 roots with Major or Minor. Note names follow the key signature; notes outside the key are spelled from the chord or scale formula (C dim7: C Eb Gb Bbb).</P>
      <P><b>Show.</b> Chord: the chord tones only. Pentatonic: the key's major or minor pentatonic, or Major and minor: both pentatonics together (1 2 ♭3 3 4 5 6 ♭7). Blues: the pentatonic with the blue note (♭3 in major, ♭5 in minor). Scale: seven-note scales. The chosen layer opens a panel under it, titled with the result (C Dorian, C major pentatonic).</P>
      <P><b>Chord → In key.</b> The seven chords of the key: I ii iii IV V vi vii° in major; i ii° III iv v VI ♭VII in minor (natural minor). Numbers count from the key or from the chord. Key numbers in a minor key are 1 2 ♭3 4 5 ♭6 ♭7.</P>
      <P><b>Chord → Any chord.</b> Triads, sevenths and added-note chords on the current chord root. The list follows whether that chord is major or minor.</P>
      <P><b>Scale.</b> The seven modes of the major scale in parent order, Ionian to Locrian, on any key root and numbered from that root (C Dorian: 1 2 ♭3 4 5 6 ♭7). Harmonic and melodic minor are under Other scales. A mode sets Major or Minor by its 3rd: Ionian, Lydian and Mixolydian are major; Dorian, Phrygian, Aeolian, Locrian and the two minor scales are minor. Positions and chord tones follow. Choosing the other of Major or Minor goes back to Ionian or Aeolian.</P>
      <H>Filter</H>
      <P><b>Position.</b> The five CAGED positions, 1 C to 5 D. One position dims the notes outside it, and the board scrolls to it when the neck is wider than the screen. In one position, a note missing from the window is added from one fret outside it (Scale and Chord). A window note that would fall below the nut is played at the same pitch on the next lower string, shown hatched (every layer; the low E string has none). In a window copy that ends at fret 21, a missing note comes from just below the window instead. All shows the five together: neutral dots over a faint tint of each window, split where two windows meet. The ruler under the fret numbers names each window's span. In All, dots cannot be tapped and Focus and Notes: Chord tones are unavailable.</P>
      <P><b>Strings.</b> Limits the board to one three-string set, 1–3 to 4–6.</P>
      <P><b>Notes.</b> Chord tones dims every other note. In Chord, every tone of the chord counts; in Scale, its 1, 3, 5 and 7; in Pentatonic, Blues and Major and minor, the 1, 3, 5 and 7 of the key's scale where present.</P>
      <P><b>Focus.</b> A tap on a dot (anywhere in its fret) or a Focus chip keeps that degree and dims the rest. More taps add degrees; a second tap releases one. A degree that cannot be lit under the current position, strings or Notes setting is unavailable.</P>
      <P><b>Filter chips and Clear.</b> Each active filter (position, strings, Notes: Chord tones, focus) shows as a chip beside the summary line; its ✕ removes it. Clear removes every filter; Key and Show stay.</P>
      <P><b>Dots.</b> Chord tones are larger and bold. With no position and in All, chord tones are light and the other notes grey. The root has a dark centre and a rim: gold with no position and in All, the position colour in a position. Dimmed notes are open circles.</P>
      <H>Display</H>
      <P><b>Labels.</b> Degrees, note names or none.</P>
      <P><b>Neck.</b> The neck fills the width when every fret has room for a full-size dot, and scrolls sideways below that.</P>
      <P><b>Other notes.</b> Shown adds the notes outside the current set as bare labels with no circle (a small dot when Labels is None).</P>
      <H>Examples</H>
      <P>Each sets Show, position, strings, focus and Notes; Display stays. ♭7 of a dominant 7th also sets Major.</P>
      <ul style={{ margin: 0, paddingLeft: 18 }}>
        {[["interlock","All five positions"],["chordtones","Chord tones in the scale"],["dom7","♭7 of a dominant 7th"],["walk","Chords in the key"]].map(([k,l]) => (
          <li key={k} className="text-sm text-body"><button onClick={() => onExample(k)} className="btn text-sm text-link underline" style={{ padding: "0 4px" }}>{l}</button></li>
        ))}
      </ul>
      <p className="text-xs text-muted" style={{ margin: "16px 0 0" }}>Fretboard Trainer {VERSION}</p>
    </div>
  );
}

// Chords and Modes: page shells until they are built; each says what it will hold and links back to Neck (Round 4b).
const PAGE_NOTE = {
  chords: ["Chords", "The seven chords of the key as triads on one string set, every inversion, stepped I to vii° along the neck. Until then, Neck → Show → Chord → In key lights one chord of the key at a time."],
  modes: ["Modes", "The seven modes of the parent key side by side, each with its characteristic tone, linked to the same mode on the neck. Until then, Neck → Show → Scale has all seven modes in any key."],
};
function PagePlaceholder({ page, onNeck }) {
  const [title, text] = PAGE_NOTE[page];
  return (
    <section className="p-3 rounded-lg" aria-label={title} style={{ background: THEME.panel, maxWidth: 760 }}>
      <h2 className="text-sm font-bold text-body" style={{ margin: "0 0 4px" }}>{title} · in progress</h2>
      <p className="text-sm text-body" style={{ margin: "0 0 12px", lineHeight: 1.5 }}>{text}</p>
      <Btn onClick={onNeck}>Back to Neck</Btn>
    </section>
  );
}

function FretboardTrainer() {
  const [page, setPage] = useState("neck");
  const [labelMode, setLabelMode] = useState("degree");
  const [isolate, setIsolate] = useState(false);
  const [ghost, setGhost] = useState(false);
  const [help, setHelp] = useState(false);
  const [cfg, setCfg] = useState({ root: 0, tonality: "major", scope: "pentatonic", arp: "triad", pos: null, focus: [], keyRoot: 0, keyMode: "major", arpMode: "diatonic", diaLabel: "key", strGroup: null, mode: "ionian" });
  const globals = { labelMode, isolate, ghost, setLabelMode, setIsolate, setGhost };
  const up = (p) => setCfg((c) => ({ ...c, ...p }));

  // Examples (was Quick start): trainer state only, Strings included; Labels, View and Other notes stay (UX-15, decision 13 = a).
  const applyPreset = (p) => {
    if (p === "interlock") {
      setCfg((c) => ({ ...c, scope: "pentatonic", pos: "all", strGroup: null, focus: [] }));
      setIsolate(false);
    } else if (p === "chordtones") {
      setCfg((c) => ({ ...c, scope: "scale", pos: null, strGroup: null, focus: [] }));
      setIsolate(true);
    } else if (p === "dom7") {
      setCfg((c) => ({ ...c, scope: "arpeggio", arpMode: "quality", arp: "dom7", tonality: "major", keyMode: "major", root: c.keyRoot, pos: null, strGroup: null, focus: [10] }));
      setIsolate(false);
    } else if (p === "walk") {
      setCfg((c) => ({ ...c, scope: "arpeggio", arpMode: "diatonic", diaLabel: "key", arp: "triad", tonality: c.keyMode, root: c.keyRoot, pos: null, strGroup: null, focus: [] }));
      setIsolate(false);
    }
    setHelp(false);
    setPage("neck");
  };
  // Clear: filters only; Key and Show stay (decision 12 = a).
  const anyFilter = cfg.pos !== null || cfg.strGroup !== null || cfg.focus.length > 0 || isolate;
  const clearAll = () => { up({ pos: null, strGroup: null, focus: [] }); setIsolate(false); };

  return (
    <div className="w-full" style={{ background: THEME.bg, color: THEME.text }}>
      <div className="p-4">
      {/* One 44 px head (IA-03): plain text title (decision 15 = a), the page switch (IA-review, mock-up A), Help and Clear.
          On a phone the switch takes its own row. A page choice closes Help; Clear acts on the Neck page only. */}
      <header className="head">
        <h1 className="text-xl font-bold text-body" style={{ margin: 0, whiteSpace: "nowrap" }}>Fretboard Trainer</h1>
        <nav className="pagenav" aria-label="Pages">
          <Track label="Page" cols={3}>{[["neck","Neck"],["chords","Chords"],["modes","Modes"]].map(([k,l]) => <Seg key={k} active={page === k && !help} onClick={() => { setPage(k); setHelp(false); }}>{l}</Seg>)}</Track>
        </nav>
        <div className="flex gap-2" style={{ marginLeft: "auto" }}>
          <Btn onClick={() => setHelp((h) => !h)} aria-pressed={help}>Help</Btn>
          <Btn onClick={clearAll} disabled={!anyFilter || page !== "neck"}>Clear</Btn>
        </div>
      </header>

      {help ? <Help onExample={applyPreset} /> : page === "neck" ? <Board cfg={cfg} update={up} globals={globals} /> : <PagePlaceholder page={page} onNeck={() => setPage("neck")} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FretboardTrainer />);
</script>
</body>
</html>
