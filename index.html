      for (let c = b - 12; c <= FRETS; c += 12) {
        const a = Math.max(0, c), z = Math.min(FRETS, c + p.w);
        if (z >= a) spans.push({ p, a, z, clipped: a !== c || z !== c + p.w });
      }
    });
    spans.sort((x, y) => x.a - y.a || x.z - y.z);
    const ends = [];
    spans.forEach((sp) => {
      let l = ends.findIndex((e) => e < sp.a);
      if (l < 0) { l = ends.length; ends.push(-1); }
      ends[l] = sp.z; sp.lane = l;
    });
    return { spans, lanes: Math.max(2, ends.length) };
  }, [posList, root]);

  // Scroll to the chosen position when the neck scrolls (RS-03 part): the window's main copy, one fret either side, centred.
  const scrollRef = React.useRef(null);
  useEffect(() => {
    const el = scrollRef.current;
    if (!el || !activePos || el.scrollWidth <= el.clientWidth) return;
    const b = (((root - 4 + activePos.off) % 12) + 12) % 12;
    const lo = el.querySelector(`[data-fret="${Math.max(0, b - 1)}"]`), hi = el.querySelector(`[data-fret="${Math.min(FRETS, b + activePos.w + 1)}"]`);
    if (!lo || !hi) return;
    const box = el.getBoundingClientRect(), l = lo.getBoundingClientRect().left - box.left + el.scrollLeft, r = hi.getBoundingClientRect().right - box.left + el.scrollLeft;
    const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollTo({ left: Math.max(0, (l + r) / 2 - el.clientWidth / 2), behavior: smooth ? "smooth" : "auto" });
  }, [pos, root, tonality]);
  const keyRel = scope === "arpeggio" && arpMode === "diatonic" && diaLabel === "key";
  const degLabel = (pc, iv) => {
    if (keyRel) {
      const ki = (((pc - keyRoot) % 12) + 12) % 12;
      return KEY_DEG[keyMode][ki] || (ki === 0 ? "1" : DEG_LABEL[ki]);
    }
    return fdeg(iv);
  };
  const labelOf = (pc, iv) => {
    if (labelMode === "name") return noteName(pc, root);
    if (labelMode !== "degree") return "";
    return degLabel(pc, iv);
  };

  const renderRow = (s) => {
    const cells = [];
    for (let f = 0; f <= FRETS; f++) {
      const pc = (OPEN[s] + f) % 12;
      const iv = ((pc - root) % 12 + 12) % 12;
      const inScope = scopeSet.has(iv);
      const isRoot = iv === 0;
      const isCT = ctSet.has(iv);
      let dim = false;
      if (strGroup !== null && (s < strGroup || s > strGroup + 2)) dim = true;
      if (!interlock) {
        if (activePos && !inWin(s, f)) dim = true;
        if (anyFocus && !focusSet.has(iv)) dim = true;
        if (isolate && !ctSet.has(iv)) dim = true;
      }
      // Fill: the position colour inside a single position. With no position and in All, Dot colour decides (Round 6b):
      // CAGED gives each note its window's colour, half and half on a diagonal where two windows share it, the lower window
      // top left (as v0.25); Neutral gives the value step (DS-05). The root (R3) has an ink centre and a rim in the same
      // colour or colours; gold where no position colour applies.
      let posFill = activePos && inWin(s, f) ? POS_COLOR[activePos.letter] : null;
      if (!activePos && caged) {
        const hits = posList.filter((p) => inPos(f, p)).sort((a, b) => phase(f, b) - phase(f, a)).map((p) => POS_COLOR[p.letter]);
        posFill = hits.length > 1 ? `linear-gradient(135deg, ${hits[0]} 0 50%, ${hits[1]} 50% 100%)` : hits[0] || null;
      }
      const fill = posFill || (isCT ? NEUTRAL_CT : NEUTRAL_OTHER);
      const rim = posFill || THEME.sel;
      const sz = isRoot || isCT ? dotBig : dotBase;
      // A nut substitute is hatched in its position colour; on a root the hatch is on the rim, the ink centre stays.
      const isSub = !interlock && subs !== null && subs.has(s * 100 + f);
      const hatch = (c) => `repeating-linear-gradient(135deg, ${c} 0 3px, ${HATCH[activePos.letter]} 3px 6px)`;
      // Filtered-out notes are monochrome open circles, not faded dots (DS-01): edge ring, muted label. The root keeps a
      // heavier ring; a nut substitute keeps a dashed one.
      const ring = (w) => `${w}px ${isSub ? "dashed" : "solid"} ${THEME.edge}`;
      const face = dim
        ? { background: "transparent", border: ring(isRoot ? 3 : 1.5), color: THEME.muted }
        : isRoot
          ? { background: isSub ? hatch(rim) : rim, color: THEME.text }
          : { background: isSub ? hatch(fill) : fill, color: THEME.ink };
      // All with Neutral dots: a faint tint of each window behind its frets, split where two windows meet (decision 6 = b).
      // With CAGED dots the dots carry the colour, so there is no tint (Round 6b). The ruler names the windows.
      let tint;
      if (interlock && !caged) {
        const hits = posList.filter((p) => inPos(f, p)).sort((a, b) => phase(f, b) - phase(f, a)).map((p) => POS_COLOR[p.letter] + "1F");
        if (hits.length) tint = hits.length > 1 ? `linear-gradient(90deg, ${hits[0]} 0 50%, ${hits[1]} 50% 100%)` : `linear-gradient(${hits[0]}, ${hits[0]})`;
      }
      const cellBg = [tint, f === 0 && THEME.track].filter(Boolean).join(", ") || undefined;
      // The whole fret cell is the dot's hit area (A11y-W2); dots leave the tab order, the Focus chips do the same job (A11y-W5).
      const tappable = inScope && !interlock;
      const title = `${noteName(pc)} · ${fdeg(iv)}`;
      cells.push(
        <div key={f} data-fret={s === 0 ? f : undefined} onClick={tappable ? () => update({ focus: toggle(activeFocus, iv) }) : undefined} className="relative flex items-center justify-center" style={{ height: cellH, borderRight: f === 0 ? `5px solid ${THEME.nut}` : `2px solid ${THEME.line}`, background: cellBg, cursor: tappable ? "pointer" : undefined }}>
          <div className="absolute left-0 right-0" style={{ top: "50%", transform: "translateY(-50%)", height: STRING_GAUGE[s], background: THEME.edge }} />
          {inScope && (isRoot && !dim ? (
            <button tabIndex={-1} disabled={interlock} className="relative rounded-full flex items-center justify-center transition-all" style={{ width: sz, height: sz, background: face.background, zIndex: 5, cursor: interlock ? "default" : "pointer" }} title={title}>
              <div className="rounded-full flex items-center justify-center" style={{ width: sz - 8, height: sz - 8, background: THEME.ink, color: face.color, fontSize: fontPx, fontWeight: 800 }}>{labelOf(pc, iv)}</div>
            </button>
          ) : (
            <button tabIndex={-1} disabled={interlock} className="relative rounded-full flex items-center justify-center transition-all" style={{ width: sz, height: sz, fontSize: fontPx, fontWeight: isRoot || isCT ? 800 : 500, ...face, zIndex: isRoot ? 5 : isCT ? 3 : 2, cursor: interlock ? "default" : "pointer" }} title={title}>{labelOf(pc, iv)}</button>
          ))}
          {/* Chromatic notes are bare labels with no circle, so a circle always means "in the set" (DS-06). */}
          {!inScope && ghost && (
            <div className="absolute flex items-center justify-center" style={{ color: dim ? THEME.edge : THEME.muted, fontSize: 11, fontWeight: 600, zIndex: 1 }} title={noteName(pc, root)}>{labelOf(pc, iv) || <span style={{ width: 5, height: 5, borderRadius: 3, background: dim ? THEME.edge : THEME.muted }} />}</div>
          )}
        </div>
      );
    }
    return (
      <div key={s} className="contents">
        <div className="flex items-center justify-center text-xs font-semibold text-muted" style={{ height: cellH }}>{STRING_LABELS[s]}</div>
        {cells}
      </div>
    );
  };

  const degrees = [...scopeSet].sort((a,b) => a-b);
  // One plain summary line (UX-07): "G7", "B diminished", "A minor pentatonic".
  const rootName = noteName(root, root);
  const summary = scope === "arpeggio"
    ? (arp === "triad" ? `${rootName} ${tonality}` : arp === "dim" ? `${rootName} diminished` : arp === "aug" ? `${rootName} augmented` : rootName + QUAL_NAME[arp])
    : scope === "scale" ? `${rootName} ${MODE_NAME[mode]}`
    : scope === "blended" ? `${rootName} major and minor pentatonic`
    : `${rootName} ${tonality} ${scope}`;

  // Active filters as chips, each with ✕; Clear in the head clears them all (UX-12, decision 12 = a). Focus shows here too (UX-17).
  const chips = [
    interlock ? ["All positions", () => update({ pos: null })] : activePos && [`Position ${activePos.num} ${activePos.letter}`, () => update({ pos: null })],
    strGroup !== null && [`Strings ${["1–3","2–4","3–5","4–6"][strGroup]}`, () => update({ strGroup: null })],
    isolate && !interlock && ["Chord tones", () => setIsolate(false)],
    anyFocus && [`Focus ${activeFocus.slice().sort((a,b) => a-b).map((iv) => degLabel((root + iv) % 12, iv)).join(" ")}`, () => update({ focus: [] })],
  ].filter(Boolean);
  // From a scale layer, Show resets the chord root and quality to the key (UX-10).
  const toKey = (k) => ({ scope: k, root: keyRoot, ...keepChord(cfg, keyMode) });

  return (
    <div>
      {/* Summary line and board first; nothing above the board changes height (UX-01, IA-03). Sticky on an upright phone (RS-03). */}
      <div className="boardwrap">
        <div className="sumrow">
          <span data-summary className="text-sm font-semibold text-body">{summary}</span>
          {chips.map(([t, clear]) => (
            <button key={t} onClick={clear} aria-label={`Remove ${t}`} className="chip flex items-center gap-1.5 px-2 rounded-lg text-xs transition-colors" style={{ background: THEME.ctl, border: `1px solid ${THEME.edge}`, color: THEME.text, fontWeight: 500 }}>
              {t}<span aria-hidden="true" className="text-muted">✕</span>
            </button>
          ))}
        </div>
        <div ref={scrollRef} className="overflow-x-auto pb-2 rounded-xl" style={{ background: THEME.panel2 }}>
          <div className="grid p-3" style={{ gridTemplateColumns: COLS, width: "100%", minWidth: "min-content" }}>
            {[0,1,2,3,4,5].map(renderRow)}
            <div />
            {/* Fret numbers: muted; marker frets bold in text. The marker-dot row is gone (DS-07). */}
            {Array.from({ length: FRETS + 1 }, (_, f) => (
              <div key={"n" + f} className="flex items-center justify-center text-xs" style={{ height: 24, color: MARKERS[f] ? THEME.text : THEME.muted, fontWeight: MARKERS[f] ? 700 : 400 }}>{f}</div>
            ))}
            {/* Position ruler (DS-03, A11y-W3): names each window span in text, always in two or more lanes so spans never
                overlap. Low-key grey where a position is not chosen; colour for the chosen position and in All (Round 6b). */}
            {Array.from({ length: ruler.lanes }, (_, l) => <div key={"rl" + l} style={{ gridRow: 8 + l, gridColumn: 1, height: 22 }} />)}
            {ruler.spans.map((sp) => {
              const on = interlock || (activePos !== null && sp.p.num === activePos.num);
              const c = on ? POS_COLOR[sp.p.letter] : THEME.line, side = on ? 2 : 1;
              return (
                <div key={`r${sp.p.num}-${sp.a}`} data-ruler={`${sp.p.num} ${sp.p.letter}`} data-on={on ? "1" : undefined} className={"flex items-end justify-center text-xs " + (on ? "font-semibold text-body" : "text-muted")}
                  style={{ gridRow: 8 + sp.lane, gridColumn: `${sp.a + 2} / ${sp.z + 3}`, height: 22, margin: "0 2px", paddingBottom: 3, whiteSpace: "nowrap", overflow: "hidden",
                    borderBottom: `${on ? 3 : 1}px solid ${c}`, borderLeft: sp.clipped && sp.a === 0 ? "none" : `${side}px solid ${c}`, borderRight: sp.clipped && sp.z === FRETS ? "none" : `${side}px solid ${c}` }}>
                  {sp.p.num} {sp.p.letter}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Four groups: Key, Show, Filter, Display; a row of cards on desktop and tablet, stacked on a phone (IA-05). */}
      <div className="groups mt-3">
      <Card title="Key">
        {/* The 12 keys as a 6 × 2 equal-cell grid, Major / Minor below; both gold (UX-09, IA-review decision 3). Each cell is
            spelled as the Neck would spell that root in the scale shown, so G♭ in Lydian (Round 9).
            Major / Minor goes back to Ionian or Aeolian unless the chosen mode already has that 3rd (Round 4b). */}
        <Row>
          <Track label="Key" cols={6}>{NOTES_SHARP.map((n,i) => <Seg key={i} tone="gold" active={keyRoot === i} onClick={() => update({ root: i, keyRoot: i, ...keepChord(cfg, keyMode) })}>{accs(spellAt(keyRoot === i ? keyLi : autoLetter(i, cfg), i))}</Seg>)}</Track>
        </Row>
        <Row>
          <Track label="Major or minor" cols={2}>{[["major","Major"],["minor","Minor"]].map(([t,l]) => <Seg key={t} tone="gold" active={keyMode === t} onClick={() => update({ keyMode: t, root: keyRoot, ...keepChord(cfg, t), mode: keyMode === t && MODE_Q(mode) === t ? mode : t === "major" ? "ionian" : "aeolian" })}>{l}</Seg>)}</Track>
        </Row>
      </Card>

      <Card title="Show">
      {/* Show as four equal cells; the sub-panel hangs off the chosen cell (caret, inset surface) and is titled with the
          resolved name, "C Dorian" or "C major pentatonic" (IA-review, mock-up C). Blues has the title only. */}
      <div>
      <Row>
        {/* Major and minor is an option under Pentatonic, not a fifth layer (feature table). */}
        <Track label="Show" cols={4}>{[["arpeggio","Chord"],["pentatonic","Pentatonic"],["blues","Blues"],["scale","Scale"]].map(([k,l]) => {
          const on = scope === k || (k === "pentatonic" && scope === "blended");
          return <Seg key={k} active={on} aria-controls="show-panel" onClick={() => { if (!on) update(k === "arpeggio" ? { scope: k } : toKey(k)); }}>{l}{on && <span aria-hidden="true" className="caret" />}</Seg>;
        })}</Track>
      </Row>

      <div id="show-panel" className="subpanel" role="group" aria-labelledby="show-title">
        <h3 id="show-title">{summary}</h3>
        {(scope === "pentatonic" || scope === "blended") && (
          <Row label="Pentatonic">
            <Track label="Pentatonic">
              <Seg active={scope === "pentatonic"} onClick={() => update(toKey("pentatonic"))}>{keyMode === "major" ? "Major" : "Minor"}</Seg>
              <Seg active={scope === "blended"} onClick={() => update(toKey("blended"))}>Major and minor</Seg>
            </Track>
          </Row>
        )}
        {scope === "arpeggio" && (
          <div className="flex flex-col gap-2">
            <Row label="Chord">
              <Track label="Chord">
                <Seg active={arpMode === "diatonic"} onClick={() => update({ arpMode: "diatonic", arp: "triad" })}>In key</Seg>
                <Seg active={arpMode === "quality"} onClick={() => { update({ arpMode: "quality" }); if (QUAL_IN_MORE(arp)) setMore(true); }}>Any chord</Seg>
              </Track>
            </Row>
            {arpMode === "diatonic" ? (
              <React.Fragment>
                <Row>
                  <Track label="Chords in the key">{DIATONIC[keyMode].map(([rn,off,q]) => {
                    const cr = (keyRoot + off) % 12;
                    const active = root === cr;
                    return <Seg key={rn} active={active} onClick={() => update({ root: cr, tonality: q === "maj" ? "major" : "minor", arp: q === "dim" ? "dim" : "triad" })}>{rn}</Seg>;
                  })}</Track>
                </Row>
                <Row label="Numbers from">
                  <Track label="Numbers from">
                    <Seg active={diaLabel === "key"} onClick={() => update({ diaLabel: "key" })}>Key</Seg>
                    <Seg active={diaLabel === "chord"} onClick={() => update({ diaLabel: "chord" })}>Chord</Seg>
                  </Track>
                </Row>
              </React.Fragment>
            ) : (
              <React.Fragment>
                {/* Common qualities, then More (IA-04, UX-16). Any chord opens More when the chosen quality is in it (vii° from In key). */}
                <Row label="Quality">
                  <Track label="Quality" cols={6}>{QUAL_COMMON.map(([k,l]) => {
                    const tri = k === "major" || k === "minor";
                    return <Seg key={k} active={tri ? arp === "triad" && tonality === k : arp === k} onClick={() => update(tri ? { arp: "triad", tonality: k } : { arp: k, tonality: QUAL_T[k] || tonality })}>{l}</Seg>;
                  })}</Track>
                </Row>
                <Row>
                  <Btn onClick={() => setMore((m) => !m)} aria-expanded={more} aria-controls="qual-more">More<span aria-hidden="true" className="text-muted" style={{ marginLeft: 6, display: "inline-block", transform: more ? "rotate(180deg)" : "none" }}>▾</span></Btn>
                </Row>
                {more && <div id="qual-more" className="flex flex-col gap-2">{QUAL_MORE.map(([group, qs, n]) => (
                  <Row key={group} label={group}>
                    <Track label={group} cols={n}>{qs.map(([k,l]) => <Seg key={k} active={arp === k} onClick={() => update({ arp: k, tonality: QUAL_T[k] || tonality })}>{l}</Seg>)}</Track>
                  </Row>
                ))}</div>}
              </React.Fragment>
            )}
          </div>
        )}
        {/* All seven modes in any key; a mode with the other 3rd switches Major / Minor (Round 4b). */}
        {scope === "scale" && [["Mode", MODES, 4], ["Other scales", OTHER_SCALES, 2]].map(([lab, list, n]) => (
          <Row key={lab} label={lab}>
            <Track label={lab} cols={n}>{list.map(([k,l]) => <Seg key={k} active={mode === k} onClick={() => {
              const q = MODE_Q(k);
              update(q === keyMode ? { mode: k } : { mode: k, keyMode: q, root: keyRoot, ...keepChord(cfg, q) });
            }}>{l}</Seg>)}</Track>
          </Row>
        ))}
      </div>
      </div>
      </Card>

      <Card title="Filter">
      <Row label="Position">
        {/* Seven equal cells on one row: the shape letter as the label, its number small, the colour as the underline (mock-up C).
            The number is 11 px, the floor (BR-05); the accessible name stays "1 C". */}
        <Track label="Position" cols={7}>
          <Seg active={pos === null} onClick={() => update({ pos: null })}>Off</Seg>
          {posList.map((p) => <Seg key={p.num} active={pos === p.num} onClick={() => update({ pos: p.num })} pos={POS_COLOR[p.letter]} aria-label={`${p.num} ${p.letter}`}><span aria-hidden="true" style={{ fontSize: 11, fontWeight: 500, marginRight: 3 }}>{p.num}</span>{p.letter}</Seg>)}
          <Seg active={interlock} onClick={() => update({ pos: "all" })}>All</Seg>
        </Track>
      </Row>

      <Row label="Strings">
        <Track label="Strings" cols={5}>
          <Seg active={strGroup === null} onClick={() => update({ strGroup: null })}>All</Seg>
          {[[0,"1–3"],[1,"2–4"],[2,"3–5"],[3,"4–6"]].map(([g,l]) => (
            <Seg key={g} active={strGroup === g} onClick={() => update({ strGroup: g })}>{l}</Seg>
          ))}
        </Track>
      </Row>

      {/* Was the Isolate chord tones toggle: same state, unavailable in All (IA-01). */}
      <Row label="Notes">
        <Track label="Notes" cols={2}>
          <Seg active={!isolate || interlock} disabled={interlock} onClick={() => setIsolate(false)}>All</Seg>
          <Seg active={isolate && !interlock} disabled={interlock} onClick={() => setIsolate(true)}>Chord tones</Seg>
        </Track>
      </Row>

      {/* Focus chips: degree and note only, chord tones bold (DS-08). The All legend is gone: the Position buttons and the
          ruler name the positions. In All the chips are unavailable, like Notes. */}
      <Row label="Focus">
        <div className="flex flex-wrap gap-2 items-center" role="group" aria-label="Focus">
          {degrees.map((iv) => {
            const focused = focusSet.has(iv);
            const ct = ctSet.has(iv);
            const off = interlock || !litSet.has(iv);
            const quiet = anyFocus && !focused;
            return (
              <button key={iv} disabled={off} aria-disabled={off} aria-pressed={focused} onClick={() => update({ focus: toggle(activeFocus, iv) })} className="chip flex items-center gap-2 px-2 rounded-lg text-xs" style={{ border: `1px solid ${focused ? "transparent" : THEME.edge}`, background: focused ? THEME.ctlHover : quiet ? "transparent" : THEME.ctl, boxShadow: focused ? `0 0 0 1.5px ${THEME.text}` : "none", opacity: off ? 0.5 : 1, cursor: off ? "default" : "pointer", fontWeight: ct ? 800 : 500 }}>
                <span className="text-body">{degLabel((root + iv) % 12, iv)}</span>
                <span className="text-muted">{noteName((root + iv) % 12, root)}</span>
              </button>
            );
          })}
        </div>
      </Row>
      </Card>

      {/* Display beside the other groups, with the board on screen (IA-01, decision 2 = b). */}
      <Card title="Display">
        <Row label="Labels">
          <Track label="Labels" cols={3}>{[["degree","Degrees"],["name","Notes"],["none","None"]].map(([k,l]) => <Seg key={k} active={labelMode === k} onClick={() => setLabelMode(k)}>{l}</Seg>)}</Track>
        </Row>
        <Row label="Other notes">
          <Track label="Other notes" cols={2}>
            <Seg active={!ghost} onClick={() => setGhost(false)}>Hidden</Seg>
            <Seg active={ghost} onClick={() => setGhost(true)}>Shown</Seg>
          </Track>
        </Row>
        {/* With no position and in All: CAGED colours each note by its window, half and half where two share it (Round 6b). */}
        <Row label="Dot colour">
          <Track label="Dot colour" cols={2}>{[["caged","CAGED"],["neutral","Neutral"]].map(([k,l]) => <Seg key={k} active={dotColour === k} onClick={() => setDotColour(k)}>{l}</Seg>)}</Track>
        </Row>
      </Card>
      </div>
    </div>
  );
}

// Help, opened from the head (IA-02, decision 2 = b). Examples set trainer state only (UX-06, UX-15, decision 13 = a).
function Help({ onExample }) {
  const H = ({ children }) => <h2 className="text-sm font-bold text-body" style={{ margin: "16px 0 4px" }}>{children}</h2>;
  const P = ({ children }) => <p className="text-sm text-body" style={{ margin: "0 0 8px", lineHeight: 1.5 }}>{children}</p>;
  // Written from the v0.31 build (CP-01, CP-04): thing-first, no second person.
  return (
    <div className="p-3 rounded-lg" style={{ background: THEME.panel, maxWidth: 760 }}>
      <P>Scales, chords and the five CAGED positions on a standard-tuned (EADGBE) neck, frets 0–21. The board comes first, with a summary line above it; the controls sit in four groups below: Key, Show, Filter and Display. The head switches between three pages: Neck (this trainer), Chords and Modes. Key and Major or Minor are the same on Neck and Chords; Modes has its own parent key.</P>
      <P><b>Copy link.</b> The address holds the page, the key and the settings on Neck, Chords and Modes, so a copied link opens the same view, for example a set-up board sent to a student. On a phone or tablet the button opens the share sheet. Back returns to the previous page.</P>
      <H>Key and Show</H>
      <P><b>Key.</b> The 12 roots with Major or Minor. Note names follow the key signature, with ♭ and ♯; notes outside the key are spelled from the chord or scale formula (C dim7: C E♭ G♭ B𝄫). The root takes the spelling with the fewer accidentals for the scale shown, so the same key cell reads F♯ in Ionian and G♭ in Lydian, E♭ in Aeolian and D♯ in Phrygian. Where both spellings tie, the standard key name stays (F♯ major, E♭ minor).</P>
      <P><b>Show.</b> Chord: the chord tones only. Pentatonic: the key's major or minor pentatonic, or Major and minor: both pentatonics together (1 2 ♭3 3 4 5 6 ♭7). Blues: the pentatonic with the blue note (♭3 in major, ♭5 in minor). Scale: seven-note scales. The chosen layer opens a panel under it, titled with the result (C Dorian, C major pentatonic).</P>
      <P><b>Chord → In key.</b> The seven chords of the key: I ii iii IV V vi vii° in major; i ii° III iv v VI ♭VII in minor (natural minor). Numbers count from the key or from the chord. Key numbers in a minor key are 1 2 ♭3 4 5 ♭6 ♭7.</P>
      <P><b>Chord → Any chord.</b> Triads, sevenths and added-note chords on the current chord root, in one list for major and minor keys. The common qualities show first: Major, Minor, 7, maj7, m7 and sus4. More opens the rest: sus2, aug and dim; 7sus4, m7♭5, dim7 and aug7; 6, add9, add11, m6, m(add9) and m(add11). A chosen quality stays when Key, Major or minor, or Show changes.</P>
      <P><b>Scale.</b> The seven modes of the major scale in parent order, Ionian to Locrian, on any key root and numbered from that root (C Dorian: 1 2 ♭3 4 5 6 ♭7). Harmonic and melodic minor are under Other scales. A mode sets Major or Minor by its 3rd: Ionian, Lydian and Mixolydian are major; Dorian, Phrygian, Aeolian, Locrian and the two minor scales are minor. Positions and chord tones follow. Choosing the other of Major or Minor goes back to Ionian or Aeolian.</P>
      <H>Filter</H>
      <P><b>Position.</b> The five CAGED positions, 1 C to 5 D. One position dims the notes outside it, and the board scrolls to it when the neck is wider than the screen. In one position, a note missing from the window is added from one fret outside it (Scale and Chord). A window note that would fall below the nut is played at the same pitch on the next lower string, shown hatched (every layer; the low E string has none). In a window copy that ends at fret 21, a missing note comes from just below the window instead. All shows the five together, coloured as Dot colour sets. The ruler under the fret numbers names each window's span: grey with no position, the chosen position in colour, all five in colour in All. In All, dots cannot be tapped and Focus and Notes: Chord tones are unavailable.</P>
      <P><b>Strings.</b> Limits the board to one three-string set, 1–3 to 4–6.</P>
      <P><b>Notes.</b> Chord tones dims every other note. In Chord, every tone of the chord counts; in Scale, its 1, 3, 5 and 7; in Pentatonic, Blues and Major and minor, the 1, 3, 5 and 7 of the key's scale where present.</P>
      <P><b>Focus.</b> A tap on a dot (anywhere in its fret) or a Focus chip keeps that degree and dims the rest. More taps add degrees; a second tap releases one. A degree that cannot be lit under the current position, strings or Notes setting is unavailable.</P>
      <P><b>Filter chips and Clear.</b> Each active filter (position, strings, Notes: Chord tones, focus) shows as a chip beside the summary line; its ✕ removes it. Clear removes every filter; Key and Show stay.</P>
      <P><b>Dots.</b> Chord tones are larger and bold. In a position, notes in the window take its colour. The root has a dark centre and a rim in the same colour. Dimmed notes are open circles.</P>
      <H>Display</H>
      <P><b>Labels.</b> Degrees, note names or none.</P>
      <P><b>Neck.</b> The neck fills the width when every fret has room for a full-size dot, and scrolls sideways below that.</P>
      <P><b>Dot colour.</b> With no position and in All. CAGED: each note takes the colour of its window, and a note shared by two windows is split half and half on a diagonal, the lower window's colour top left, so the shapes show where they interlock. Neutral: chord tones light, other notes grey, roots with a gold rim; in All each window is then tinted faintly behind its frets.</P>
      <P><b>Other notes.</b> Shown adds the notes outside the current set as bare labels with no circle (a small dot when Labels is None).</P>
      <H>Chords page</H>
      <P><b>The ladder.</b> The seven triads of the key, I ii iii IV V vi vii° in major and i ii° III iv v VI ♭VII in minor, as closed voicings on one three-string set, all on the neck at once. The chosen chord is filled, the other six are outlined, and each has its Roman numeral above it. I sits at its lowest place on the neck and each chord climbs from the one before; a chord that would pass fret 21 is shown an octave lower.</P>
      <P><b>Chord strip.</b> Numeral, chord name and frets, low string to high, for each chord. A tap chooses a chord; ◀ and ▶ step down and up, wrapping round. The arrow keys step too, inside the strip and anywhere on the page outside another control group.</P>
      <P><b>Triads or Sevenths.</b> Sevenths shows the seven diatonic seventh chords, Imaj7 ii7 iii7 IVmaj7 V7 vi7 viiø7 in major and i7 iiø7 IIImaj7 iv7 v7 VImaj7 ♭VII7 in minor, as drop-2 voicings on one four-string set: a close voicing with its second note from the top dropped an octave. The ladder, strip and stepper work as for triads. Triads, Drop 2 and Drop 3 each keep their own Strings and Inversion.</P>
      <P><b>Voicing.</b> Sevenths only. Drop 2 as above; Drop 3 drops the third note from the top of a close voicing an octave instead, on strings 5 3 2 1 or 6 4 3 2, with the 4th or 5th string skipped.</P>
      <P><b>Minor scale.</b> Sevenths in a minor key only. Natural gives the sevenths of natural minor; Harmonic gives those of harmonic minor, with its raised 7th: i(maj7) iiø7 III+maj7 iv7 V7 VImaj7 vii°7 (m(maj7), m7♭5, maj7♯5, m7, 7, maj7, dim7). Triads stay natural minor.</P>
      <P><b>Strings and Inversion.</b> Triads: string sets 1–3 to 4–6. Root position has the root on the set's lowest string, 1st inversion the 3rd, 2nd inversion the 5th. Drop 2: string sets 1–4, 2–5 and 3–6, named by the bass note the same way, low string to high: root position R 5 7 3, 1st inversion 3 7 R 5, 2nd inversion 5 R 3 7, 3rd inversion 7 3 5 R. Drop 3: root position R 7 3 5, 1st inversion 3 R 5 7, 2nd inversion 5 3 7 R, 3rd inversion 7 5 R 3.</P>
      <P><b>Numbers from and Scale behind.</b> Key numbers every note by its degree in the key (1 to 7; ♭3 ♭6 ♭7 in minor; ♭3 ♭6 7 in harmonic minor); Chord numbers each shape from its own root (R 3 5, ♭3 in minor chords, ♭5 in diminished; 7 or ♭7 in sevenths; ♯5 in maj7♯5, 𝄫7 in dim7). Scale behind shows the key's other notes on the string set as bare labels, numbered the same way, counting from the chosen chord with Chord.</P>
      <H>Modes page</H>
      <P><b>The chart.</b> The seven modes of one parent major key in parent order, Ionian to Locrian: degree, mode, quality, root, the scale tones from that root, and the chord to solo over in Nashville numbers. The light square marks each mode's characteristic tone: ♮4 and ♮7 in Ionian, ♮6 in Dorian, ♭2 in Phrygian, ♯4 in Lydian, ♭7 in Mixolydian, ♭6 in Aeolian, ♭5 in Locrian. View: Notes shows each note with its number below; Numbers shows the formula alone. The data and wording are those of the ChordCharts modal reference.</P>
      <P><b>Find a parent key.</b> A root and a mode give the parent key (D Dorian: C major, its 2nd mode). The chart moves to that key and marks the row.</P>
      <P><b>Rows.</b> Show … on the neck opens the Neck page on that mode, as Key, Show → Scale and the mode would there; filters stay. The arrow button opens the row's details: solo over, vamp, colour note, avoid / resolve and feel. Avoid and resolve notes are a jazz guideline; in country, blues and rock they are used freely as passing and bend tones. The Neck page keeps the row's root as spelled here (G♭ Ionian, D♯ Phrygian) until Key changes, or until a scale is chosen that the other spelling writes with fewer accidentals.</P>
      <H>Examples</H>
      <P>Each sets Show, position, strings, focus and Notes; Display stays. ♭7 of a dominant 7th also sets Major.</P>
      <ul style={{ margin: 0, paddingLeft: 18 }}>
        {[["interlock","All five positions"],["chordtones","Chord tones in the scale"],["dom7","♭7 of a dominant 7th"],["walk","Chords in the key"]].map(([k,l]) => (
          <li key={k} className="text-sm text-body"><button onClick={() => onExample(k)} className="btn text-sm text-link underline" style={{ padding: "0 4px" }}>{l}</button></li>
        ))}
      </ul>
      <p className="text-xs text-muted" style={{ margin: "16px 0 0" }}>Fretboard Trainer {VERSION}</p>
    </div>
  );
}

// Chords page (Round 5, IA-review mock-ups D and E): the seven diatonic triads of the key as closed voicings on one
// three-string set, all seven on the neck at once, the chosen one filled and the rest outlined, Roman numerals above.
// Sevenths (Round 8, IA-review decision 5): drop-2 on four-string sets. Key and Major / Minor are shared with the Neck page.
// Names on this page use ♭ / ♯ (Round 5); the Neck page keeps b / # until Round 4b item 6 is decided there.
const uniAcc = (s) => s.replace(/b/g, "♭").replace(/#/g, "♯");
const INV_NAME = ["root position", "1st inversion", "2nd inversion"];
const SET_NAME = ["1–3", "2–4", "3–5", "4–6"];
const TRIAD_Q = { maj: ["major", ""], min: ["minor", "m"], dim: ["diminished", "°"] };
// Sevenths (Round 8): the diatonic seventh chords of the key's Ionian or Aeolian degrees, as drop-2 voicings on a
// four-string set. Inversions are named by the bass note, as for triads: low to high, root position R 5 7 3, 1st 3 7 R 5,
// 2nd 5 R 3 7, 3rd 7 3 5 R (chord-tone indices 0 R, 1 3rd, 2 5th, 3 7th).
const INV_NAME7 = [...INV_NAME, "3rd inversion"];
const SET_NAME7 = ["1–4", "2–5", "3–6"];
const SEV_Q = { maj7: ["major 7th", "maj7"], m7: ["minor 7th", "m7"], dom7: ["dominant 7th", "7"], m7b5: ["half-diminished 7th", "m7♭5"],
  mmaj7: ["minor-major 7th", "m(maj7)"], maj7s5: ["augmented major 7th", "maj7♯5"], dim7: ["diminished 7th", "dim7"] };
const CH_Q = { ...TRIAD_Q, ...SEV_Q };
// Harmonic minor (Round 10): Sevenths in a minor key may take the sevenths of harmonic minor, with its raised 7th.
// Triads stay natural minor.
const DIATONIC7 = {
  major: [["Imaj7","maj7"],["ii7","m7"],["iii7","m7"],["IVmaj7","maj7"],["V7","dom7"],["vi7","m7"],["viiø7","m7b5"]],
  minor: [["i7","m7"],["iiø7","m7b5"],["IIImaj7","maj7"],["iv7","m7"],["v7","m7"],["VImaj7","maj7"],["♭VII7","dom7"]],
  harmonic: [["i(maj7)","mmaj7"],["iiø7","m7b5"],["III+maj7","maj7s5"],["iv7","m7"],["V7","dom7"],["VImaj7","maj7"],["vii°7","dim7"]],
};
const KEY_DEG_HM = { 0: "1", 2: "2", 3: "♭3", 5: "4", 7: "5", 8: "♭6", 11: "7" };
// The key signature with the raised 7th (A minor: G♯; G♯ minor: F𝄪), for harmonic minor on the Chords page.
function hmSpelling(keyRoot) {
  const li = LETTERS.indexOf(KEY_NAME.minor[keyRoot][0]), map = {};
  MODE_IV.harmonic.forEach((s, k) => { const pc = (keyRoot + s) % 12; map[pc] = { name: spellAt(li + k, pc), letter: li + k }; });
  return map;
}
const DROP2 = [[0,2,3,1],[1,3,0,2],[2,0,1,3],[3,1,2,0]];
// Drop-3 (Round 10): a close voicing with its third note from the top dropped an octave, on strings 5 3 2 1 or 6 4 3 2
// (one string skipped). Named by the bass note, low to high: root position R 7 3 5, 1st 3 R 5 7, 2nd 5 3 7 R, 3rd 7 5 R 3.
const DROP3 = [[0,3,1,2],[1,0,2,3],[2,1,3,0],[3,2,0,1]];
const SET_NAME3 = ["5 3 2 1", "6 4 3 2"];
// The strings of a seventh set, low to high, by voicing (2 or 3) and set index g (top string index).
const SET_STRS = { 2: (g) => [g + 3, g + 2, g + 1, g], 3: (g) => [g + 4, g + 2, g + 1, g] };
// The ladder on string set g (top string index: 0 = strings 1–3). Chord k's bass, on the set's lowest string, is the chord
// tone the inversion puts there; each higher string takes the next chord tone above (closed). I sits at its lowest place
// on the neck and each chord climbs from the one below; a chord that would pass fret 21 drops an octave (Round 5).
// Frets per shape are listed low string to high, as in the strip.
function triadLadder(keyRoot, keyMode, g, inv) {
  const sc = MODE_IV[keyMode === "major" ? "ionian" : "aeolian"];
  const strs = [g + 2, g + 1, g];
  let prev = null;
  return DIATONIC[keyMode].map(([rn, off, q], k) => {
    const pcs = [0, 2, 4].map((j) => (keyRoot + sc[(k + j) % 7]) % 12);
    const order = [...pcs.slice(inv), ...pcs.slice(0, inv)];
    const up = (p, pc) => { let m = p; while (((m % 12) + 12) % 12 !== pc) m++; return m; };
    const build = (b) => { const ps = [b]; order.slice(1).forEach((pc) => ps.push(up(ps[ps.length - 1] + 1, pc))); return ps; };
    let bass;
    if (prev === null) { bass = up(OPEN_ABS[strs[0]] - 12, order[0]); while (build(bass).some((m, i) => m - OPEN_ABS[strs[i]] < 0)) bass += 12; }
    else bass = up(prev + 1, order[0]);
    prev = bass;
    let frets = build(bass).map((m, i) => m - OPEN_ABS[strs[i]]);
    if (Math.max(...frets) > FRETS) frets = frets.map((f) => f - 12);
    return { rn, root: pcs[0], q, cells: frets.map((f, i) => ({ s: strs[i], f, pc: (OPEN[strs[i]] + f) % 12 })), frets };
  });
}
// The seventh ladder on string set g (top string index: 0 = strings 1–4): as triadLadder, with the drop-2 order of the
// inversion. Each tone is the next one above the string below, which gives the drop-2 spacing (bass to top under 2 octaves).
// Drop-3 (Round 10) uses its own order and strings the same way; harm takes harmonic minor's sevenths (minor keys only).
function seventhLadder(keyRoot, keyMode, g, inv, drop = 2, harm = false) {
  const sc = MODE_IV[harm ? "harmonic" : keyMode === "major" ? "ionian" : "aeolian"];
  const strs = SET_STRS[drop](g);
  let prev = null;
  return DIATONIC7[harm ? "harmonic" : keyMode].map(([rn, q], k) => {
    const pcs = [0, 2, 4, 6].map((j) => (keyRoot + sc[(k + j) % 7]) % 12);
    const order = (drop === 3 ? DROP3 : DROP2)[inv].map((i) => pcs[i]);
    const up = (p, pc) => { let m = p; while (((m % 12) + 12) % 12 !== pc) m++; return m; };
    const build = (b) => { const ps = [b]; order.slice(1).forEach((pc) => ps.push(up(ps[ps.length - 1] + 1, pc))); return ps; };
    let bass;
    if (prev === null) { bass = up(OPEN_ABS[strs[0]] - 12, order[0]); while (build(bass).some((m, i) => m - OPEN_ABS[strs[i]] < 0)) bass += 12; }
    else bass = up(prev + 1, order[0]);
    prev = bass;
    let frets = build(bass).map((m, i) => m - OPEN_ABS[strs[i]]);
    if (Math.max(...frets) > FRETS) frets = frets.map((f) => f - 12);
    return { rn, root: pcs[0], q, cells: frets.map((f, i) => ({ s: strs[i], f, pc: (OPEN[strs[i]] + f) % 12 })), frets };
  });
}

// Characters after a name's break point in the strip (Round 10): C♯m | (maj7), G♭ | maj7♯5.
const STRIP_BREAK = { mmaj7: 6, maj7s5: 6 };
// The chord strip: numeral, name and frets per chord, a radio group with ◀ ▶ either side. Arrow keys move and choose
// inside it; on the page, ← and → step the chord when focus is not in another control group (Round 5).
function ChordStrip({ ladder, deg, setDeg, nameOf }) {
  const ref = React.useRef(null);
  const step = (d) => setDeg((deg + d + 7) % 7);
  const onKeyDown = (e) => {
    const k = e.key;
    const d = k === "ArrowRight" || k === "ArrowDown" ? 1 : k === "ArrowLeft" || k === "ArrowUp" ? -1 : 0;
    if (!d && k !== "Home" && k !== "End") return;
    e.preventDefault();
    const n = k === "Home" ? 0 : k === "End" ? 6 : (deg + d + 7) % 7;
    setDeg(n);
    ref.current.querySelectorAll('[role="radio"]')[n].focus();
  };
  return (
    <div className="strip">
      <Btn onClick={() => step(-1)} aria-label="Previous chord">◀</Btn>
      <div ref={ref} className="striptrack" role="radiogroup" aria-label="Chords in the key" onKeyDown={onKeyDown}>
        {ladder.map((c, k) => (
          <button key={c.rn} role="radio" aria-checked={k === deg} tabIndex={k === deg ? 0 : -1} onClick={() => setDeg(k)} className="stripcell transition-colors"
            aria-label={`${c.rn}, ${nameOf(c)}, frets ${c.frets.join(" ")}`}
            style={{ background: k === deg ? THEME.ctlHover : "transparent", boxShadow: k === deg ? `0 0 0 1.5px ${THEME.text}` : "none", color: k === deg ? THEME.text : THEME.muted }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: THEME.text }}>{c.rn}</span>
            {/* m(maj7) and maj7♯5 (Round 10) can be too wide for a phone cell: they may break before "(maj7)" or "maj7♯5",
                as seventh frets break between pairs. */}
            {STRIP_BREAK[c.q] ? (() => {
              const n = nameOf(c), i = n.length - STRIP_BREAK[c.q];
              return (
                <span data-name style={{ fontSize: 12.5, fontWeight: k === deg ? 700 : 500, whiteSpace: "normal", textAlign: "center", lineHeight: 1.25 }}>
                  <span style={{ whiteSpace: "nowrap" }}>{n.slice(0, i)}</span><wbr /><span style={{ whiteSpace: "nowrap" }}>{n.slice(i)}</span>
                </span>
              );
            })() : <span style={{ fontSize: 12.5, fontWeight: k === deg ? 700 : 500 }}>{nameOf(c)}</span>}
            {c.frets.length === 4 ? (
              // Sevenths: four frets may not fit a narrow cell on one line; they then break between the pairs (Round 8).
              <span data-frets style={{ fontSize: 11, fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", color: THEME.muted, whiteSpace: "normal", textAlign: "center", lineHeight: 1.25 }}>
                <span style={{ whiteSpace: "nowrap" }}>{c.frets.slice(0, 2).join(" ")}</span> <span style={{ whiteSpace: "nowrap" }}>{c.frets.slice(2).join(" ")}</span>
              </span>
            ) : <span style={{ fontSize: 11, fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", color: THEME.muted }}>{c.frets.join(" ")}</span>}
          </button>
        ))}
      </div>
      <Btn onClick={() => step(1)} aria-label="Next chord">▶</Btn>
    </div>
  );
}

function ChordsPage({ cfg, update, ch, setCh }) {
  const { keyRoot, keyMode, arp, arpMode, mode } = cfg;
  const { deg, strSet, inv, numFrom, scaleBehind, sev, strSet7, inv7, drop3, strSet3, inv3, harm } = ch;
  // Triads, drop-2 and drop-3 sevenths each keep their own string set and inversion (Rounds 8 and 10).
  const d3 = sev && drop3, hm = sev && harm && keyMode === "minor";
  const g = sev ? (drop3 ? strSet3 : strSet7) : strSet, iv = sev ? (drop3 ? inv3 : inv7) : inv;
  const setDeg = (d) => setCh((c) => ({ ...c, deg: d }));
  const ladder = useMemo(() => (sev ? seventhLadder(keyRoot, keyMode, g, iv, d3 ? 3 : 2, hm) : triadLadder(keyRoot, keyMode, g, iv)), [keyRoot, keyMode, sev, g, iv, d3, hm]);
  const keySp = useMemo(() => (hm ? hmSpelling(keyRoot) : keySpelling(keyRoot, keyMode)), [keyRoot, keyMode, hm]);
  // accs: as uniAcc, with 𝄪 for the raised 7th of G♯ harmonic minor (F𝄪).
  const nameOf = (c) => accs(keySp[c.root].name) + CH_Q[c.q][1];
  const cur = ladder[deg];
  const kDeg = hm ? KEY_DEG_HM : KEY_DEG[keyMode];
  // Numbers from Key: key degrees (minor 1 2 ♭3 4 5 ♭6 ♭7; harmonic minor 7). From Chord: each shape from its own root
  // (R 3 5, ♭3, ♭5; ♯5 in maj7♯5, 𝄫7 in dim7).
  const label = (pc, chordRoot, q) => {
    if (numFrom === "key") return kDeg[(((pc - keyRoot) % 12) + 12) % 12];
    const d = (((pc - chordRoot) % 12) + 12) % 12;
    return (DEG_OVERRIDE[q] && DEG_OVERRIDE[q][d]) || DEG_LABEL[d];
  };
  const cell = {};
  ladder.forEach((c, k) => c.cells.forEach((x) => { cell[x.s * 100 + x.f] = { k, c }; }));
  const inKey = (pc) => kDeg[(((pc - keyRoot) % 12) + 12) % 12] !== undefined;
  const setStrs = sev ? SET_STRS[d3 ? 3 : 2](g) : [g, g + 1, g + 2];
  const onSet = (s) => setStrs.includes(s);

  // Scroll the chosen shape into view when the neck scrolls, as the Neck page does for a position.
  const scrollRef = React.useRef(null);
  useEffect(() => {
    const el = scrollRef.current;
    if (!el || el.scrollWidth <= el.clientWidth) return;
    const lo = el.querySelector(`[data-fret="${Math.max(0, Math.min(...cur.frets) - 1)}"]`), hi = el.querySelector(`[data-fret="${Math.min(FRETS, Math.max(...cur.frets) + 1)}"]`);
    if (!lo || !hi) return;
    const box = el.getBoundingClientRect(), l = lo.getBoundingClientRect().left - box.left + el.scrollLeft, r = hi.getBoundingClientRect().right - box.left + el.scrollLeft;
    const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollTo({ left: Math.max(0, (l + r) / 2 - el.clientWidth / 2), behavior: smooth ? "smooth" : "auto" });
  }, [deg, sev, g, iv, d3, hm, keyRoot, keyMode]);

  // ← and → step the chord from anywhere on the page except inside a control group, which keeps its own arrow keys.
  useEffect(() => {
    const onKey = (e) => {
      if ((e.key !== "ArrowLeft" && e.key !== "ArrowRight") || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const t = e.target;
      if (t && t.closest && t.closest('[role="radiogroup"], input, select, textarea')) return;
      e.preventDefault();
      setCh((c) => ({ ...c, deg: (c.deg + (e.key === "ArrowRight" ? 1 : -1) + 7) % 7 }));
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);

  const cellH = 46, fontPx = 11;
  const COLS = `30px ${COL_PX.map((n) => `minmax(${n}px, ${n}fr)`).join(" ")}`;
  const renderRow = (s) => {
    const cells = [];
    for (let f = 0; f <= FRETS; f++) {
      const pc = (OPEN[s] + f) % 12;
      const hit = cell[s * 100 + f];
      let dot = null;
      if (hit) {
        const isRoot = pc === hit.c.root;
        const lab = label(pc, hit.c.root, hit.c.q);
        const title = `${hit.c.rn} ${nameOf(hit.c)} · ${accs(keySp[pc].name)}`;
        if (hit.k === deg) {
          // The chosen shape: neutral light dots with ink labels; its root is R3, a dark centre with a gold rim (Round 5).
          dot = isRoot ? (
            <div data-shape={hit.k} data-chosen="1" data-root="1" title={title} className="relative rounded-full flex items-center justify-center" style={{ width: 30, height: 30, background: THEME.sel, zIndex: 5 }}>
              <div className="rounded-full flex items-center justify-center" style={{ width: 22, height: 22, background: THEME.ink, color: THEME.text, fontSize: fontPx, fontWeight: 800 }}>{lab}</div>
            </div>
          ) : (
            <div data-shape={hit.k} data-chosen="1" title={title} className="relative rounded-full flex items-center justify-center" style={{ width: 30, height: 30, background: NEUTRAL_CT, color: THEME.ink, fontSize: fontPx, fontWeight: 800, zIndex: 3 }}>{lab}</div>
          );
        } else {
          // The other six: outlined, text-colour labels; a root has the heavier ring, as a dimmed root does on the Neck page.
          dot = <div data-shape={hit.k} data-root={isRoot ? "1" : undefined} title={title} className="relative rounded-full flex items-center justify-center" style={{ width: 26, height: 26, background: THEME.panel2, border: `${isRoot ? 3 : 2}px solid ${THEME.edge}`, color: THEME.text, fontSize: fontPx, fontWeight: 500, zIndex: 2 }}>{lab}</div>;
        }
      } else if (scaleBehind && onSet(s) && inKey(pc)) {
        // Scale behind: the key's other notes on the set as bare labels, like Other notes on the Neck page.
        dot = <div data-behind="1" className="relative" style={{ color: THEME.muted, fontSize: 11, fontWeight: 600 }} title={accs(keySp[pc].name)}>{label(pc, cur.root, cur.q)}</div>;
      }
      cells.push(
        <div key={f} data-fret={s === 0 ? f : undefined} className="relative flex items-center justify-center" style={{ gridRow: s + 2, gridColumn: f + 2, height: cellH, borderRight: f === 0 ? `5px solid ${THEME.nut}` : `2px solid ${THEME.line}`, background: f === 0 ? THEME.track : undefined }}>
          <div className="absolute left-0 right-0" style={{ top: "50%", transform: "translateY(-50%)", height: STRING_GAUGE[s], background: THEME.edge }} />
          {dot}
        </div>
      );
    }
    return (
      <div key={s} className="contents">
        <div className="flex items-center justify-center text-xs font-semibold" style={{ gridRow: s + 2, gridColumn: 1, height: cellH, color: onSet(s) ? THEME.text : THEME.muted }}>{STRING_LABELS[s]}</div>
        {cells}
      </div>
    );
  };

  const keyName = uniAcc(KEY_NAME[keyMode][keyRoot]);
  const summary = `${keyName} ${hm ? "harmonic minor" : keyMode} · ${cur.rn} · ${accs(keySp[cur.root].name)} ${CH_Q[cur.q][0]} · ${d3 ? "drop 3, " : ""}strings ${(sev ? (d3 ? SET_NAME3 : SET_NAME7) : SET_NAME)[g]}, ${(sev ? INV_NAME7 : INV_NAME)[iv]}`;
  // Key and Major / Minor act exactly as on the Neck page, so both pages stay on one key.
  const opt = (k, v) => setCh((c) => ({ ...c, [k]: v }));

  return (
    <div>
      <div className="boardwrap">
        <div className="sumrow">
          <span data-summary aria-live="polite" className="text-sm font-semibold text-body">{summary}</span>
        </div>
        <div ref={scrollRef} className="overflow-x-auto pb-2 rounded-xl" style={{ background: THEME.panel2 }}>
          <div className="grid p-3" style={{ gridTemplateColumns: COLS, width: "100%", minWidth: "min-content" }}>
            {/* Roman numerals above the neck, each centred over its shape's frets; the chosen one in text colour. */}
            {ladder.map((c, k) => (
              <div key={"rn" + c.rn} data-numeral={k} className="flex items-end justify-center" style={{ gridRow: 1, gridColumn: `${Math.min(...c.frets) + 2} / ${Math.max(...c.frets) + 3}`, height: 22, paddingBottom: 2, fontSize: 12.5, fontWeight: 700, whiteSpace: "nowrap", color: k === deg ? THEME.text : THEME.muted }}>{c.rn}</div>
            ))}
            <div style={{ gridRow: 1, gridColumn: 1, height: 22 }} />
            {[0,1,2,3,4,5].map(renderRow)}
            {Array.from({ length: FRETS + 1 }, (_, f) => (
              <div key={"n" + f} className="flex items-center justify-center text-xs" style={{ gridRow: 8, gridColumn: f + 2, height: 24, color: MARKERS[f] ? THEME.text : THEME.muted, fontWeight: MARKERS[f] ? 700 : 400 }}>{f}</div>
            ))}
          </div>
        </div>
        <ChordStrip ladder={ladder} deg={deg} setDeg={setDeg} nameOf={nameOf} />
      </div>

      <div className="cgroups mt-3">
        <Card title="Key">
          <Row>
            <Track label="Key" cols={6}>{NOTES_SHARP.map((n, i) => <Seg key={i} tone="gold" active={keyRoot === i} onClick={() => update({ root: i, keyRoot: i, ...keepChord(cfg, keyMode) })}>{uniAcc(KEY_NAME[keyMode][i])}</Seg>)}</Track>
          </Row>
          <Row>
            <Track label="Major or minor" cols={2}>{[["major","Major"],["minor","Minor"]].map(([t,l]) => <Seg key={t} tone="gold" active={keyMode === t} onClick={() => update({ keyMode: t, root: keyRoot, ...keepChord(cfg, t), mode: keyMode === t && MODE_Q(mode) === t ? mode : t === "major" ? "ionian" : "aeolian" })}>{l}</Seg>)}</Track>
          </Row>
        </Card>
        <Card title="Diatonic chords">
          <div className="crows">
            <Row label="Chords">
              <Track label="Chords" cols={2}>{[[false,"Triads"],[true,"Sevenths"]].map(([v,l]) => <Seg key={l} active={sev === v} onClick={() => opt("sev", v)}>{l}</Seg>)}</Track>
            </Row>
            {/* Round 10: Voicing (Drop 2 / Drop 3) and, in a minor key, Minor scale (Natural / Harmonic) for Sevenths only. */}
            {sev && <Row label="Voicing">
              <Track label="Voicing" cols={2}>{[[false,"Drop 2"],[true,"Drop 3"]].map(([v,l]) => <Seg key={l} active={drop3 === v} onClick={() => opt("drop3", v)}>{l}</Seg>)}</Track>
            </Row>}
            {sev && keyMode === "minor" && <Row label="Minor scale">
              <Track label="Minor scale" cols={2}>{[[false,"Natural"],[true,"Harmonic"]].map(([v,l]) => <Seg key={l} active={harm === v} onClick={() => opt("harm", v)}>{l}</Seg>)}</Track>
            </Row>}
            <Row label="Strings">
              <Track label="Strings" cols={sev ? (drop3 ? 2 : 3) : 4}>{(sev ? (drop3 ? SET_NAME3 : SET_NAME7) : SET_NAME).map((l, j) => <Seg key={l} active={g === j} onClick={() => opt(sev ? (drop3 ? "strSet3" : "strSet7") : "strSet", j)}>{l}</Seg>)}</Track>
            </Row>
            <Row label="Inversion">
              <Track label="Inversion" cols={sev ? 4 : 3}>{["Root", "1st", "2nd", "3rd"].slice(0, sev ? 4 : 3).map((l, i) => <Seg key={i} active={iv === i} onClick={() => opt(sev ? (drop3 ? "inv3" : "inv7") : "inv", i)}>{l}</Seg>)}</Track>
            </Row>
            <Row label="Numbers from">
              <Track label="Numbers from" cols={2}>{[["key","Key"],["chord","Chord"]].map(([k,l]) => <Seg key={k} active={numFrom === k} onClick={() => opt("numFrom", k)}>{l}</Seg>)}</Track>
            </Row>
            <Row label="Scale behind">
              <Track label="Scale behind" cols={2}>{[[false,"Hidden"],[true,"Shown"]].map(([v,l]) => <Seg key={l} active={scaleBehind === v} onClick={() => opt("scaleBehind", v)}>{l}</Seg>)}</Track>
            </Row>
          </div>
        </Card>
      </div>
    </div>
  );
}

// Modes page (Round 6, IA-review mock-up F): the seven modes of one parent major key, each with its characteristic tone,
// a reverse lookup that finds the parent key, and a link from each row to that mode on the Neck page.
// MODE_REF and MODE_REF_OFF are copied verbatim from ChordCharts (NashvilleChartEditor.jsx at 3387f8d, `ModeReference`),
// so the two apps carry the same data and wording. Spelled with ♭ / ♯, as on the Chords page.
const MODE_REF = {"keys": {"C": ["C", "D", "E", "F", "G", "A", "B"], "D♭": ["D♭", "E♭", "F", "G♭", "A♭", "B♭", "C"], "D": ["D", "E", "F♯", "G", "A", "B", "C♯"], "E♭": ["E♭", "F", "G", "A♭", "B♭", "C", "D"], "E": ["E", "F♯", "G♯", "A", "B", "C♯", "D♯"], "F": ["F", "G", "A", "B♭", "C", "D", "E"], "G♭": ["G♭", "A♭", "B♭", "C♭", "D♭", "E♭", "F"], "G": ["G", "A", "B", "C", "D", "E", "F♯"], "A♭": ["A♭", "B♭", "C", "D♭", "E♭", "F", "G"], "A": ["A", "B", "C♯", "D", "E", "F♯", "G♯"], "B♭": ["B♭", "C", "D", "E♭", "F", "G", "A"], "B": ["B", "C♯", "D♯", "E", "F♯", "G♯", "A♯"]}, "order": ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"], "modes": [{"deg": 1, "name": "Ionian", "quality": "Major", "formula": ["1", "2", "3", "4", "5", "6", "7"], "char": [3, 6], "solo": "1maj<sup>7</sup>", "vamp": "1 – 4 – 5", "color": "♮4 & ♮7 (reference major)", "avoid": "♮4 (11) → 3", "feel": "Plain major"}, {"deg": 2, "name": "Dorian", "quality": "Minor", "formula": ["1", "2", "♭3", "4", "5", "6", "♭7"], "char": [5], "solo": "1m<sup>7</sup>", "vamp": "1m – 4", "color": "♮6 (13)", "avoid": "none critical — ♮6 is the target", "feel": "Bright minor — folk-rock, funk, jam vamps"}, {"deg": 3, "name": "Phrygian", "quality": "Minor", "formula": ["1", "♭2", "♭3", "4", "5", "♭6", "♭7"], "char": [1], "solo": "1m<sup>7</sup>", "vamp": "♭2 – 1m", "color": "♭2 (♭9)", "avoid": "♭2 unless ♭II present", "feel": "Dark, Spanish — metal, static minor"}, {"deg": 4, "name": "Lydian", "quality": "Major", "formula": ["1", "2", "3", "♯4", "5", "6", "7"], "char": [3], "solo": "1maj<sup>7♯11</sup>", "vamp": "1 – 2", "color": "♯4 (♯11)", "avoid": "none — ♯4 replaces the avoid note", "feel": "Dreamy, non-resolving major"}, {"deg": 5, "name": "Mixolydian", "quality": "Major", "formula": ["1", "2", "3", "4", "5", "6", "♭7"], "char": [6], "solo": "1<sup>7</sup>", "vamp": "1 – ♭7 – 4", "color": "♭7", "avoid": "♮4 (11) → 3", "feel": "Country/rock dominant — over I7 & V7"}, {"deg": 6, "name": "Aeolian", "quality": "Minor", "formula": ["1", "2", "♭3", "4", "5", "♭6", "♭7"], "char": [5], "solo": "1m<sup>7</sup>", "vamp": "1m – ♭6 – ♭7", "color": "♭6", "avoid": "♭6 → switch to Dorian if 4 is major", "feel": "Natural-minor songs, ballads"}, {"deg": 7, "name": "Locrian", "quality": "Diminished", "formula": ["1", "♭2", "♭3", "4", "♭5", "♭6", "♭7"], "char": [4], "solo": "1m<sup>7♭5</sup>", "vamp": "1ø (rare as tonic)", "color": "♭5", "avoid": "♭2 → sub Locrian ♮2", "feel": "Half-diminished; brief/passing"}], "rootLabels": ["C", "D♭ / C♯", "D", "E♭ / D♯", "E", "F", "G♭ / F♯", "G", "A♭ / G♯", "A", "B♭ / A♯", "B"]};
const MODE_REF_OFF = [0, 2, 4, 5, 7, 9, 11];
const MODE_ORD = ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th"];
// "1m<sup>7♭5</sup>" as text with a superscript, without innerHTML.
const supText = (s) => s.split(/<sup>|<\/sup>/).map((t, i) => (i % 2 ? <sup key={i}>{t}</sup> : t));

function ModesPage({ md, setMd, onNeck }) {
  const { parent, view, hit, lkRoot, lkMode, open } = md;
  const key = MODE_REF.order[parent];
  const sc = MODE_REF.keys[key];
  const set = (p) => setMd((m) => ({ ...m, ...p }));
  const rowRefs = React.useRef({});
  // Reverse lookup, as in ChordCharts: a root and a mode give the parent key; the chart moves there and marks the row.
  const lookup = (r, m) => {
    if (r === "" || m === "") { set({ lkRoot: r, lkMode: m }); return; }
    const p = (((+r - MODE_REF_OFF[+m]) % 12) + 12) % 12;
    set({ lkRoot: r, lkMode: m, parent: p, hit: +m });
    setTimeout(() => {
      const el = rowRefs.current[+m];
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
    }, 30);
  };
  const toggleOpen = (i) => set({ open: open.includes(i) ? open.filter((x) => x !== i) : [...open, i] });
  const found = hit !== null && lkRoot !== "" && lkMode !== "";

  return (
    <div>
      <div className="mtop">
        <Card title="Parent key">
          {/* The 12 major keys as a 6 × 2 equal-cell grid in gold, as the Key card on Neck and Chords. */}
          <Row>
            <Track label="Parent key" cols={6}>{MODE_REF.order.map((k, i) => <Seg key={k} tone="gold" active={parent === i} onClick={() => set({ parent: i, hit: null, lkRoot: "", lkMode: "" })}>{k}</Seg>)}</Track>
          </Row>
          <Row label="View">
            <Track label="View" cols={2}>{[["notes", "Notes"], ["numbers", "Numbers"]].map(([k, l]) => <Seg key={k} active={view === k} onClick={() => set({ view: k })}>{l}</Seg>)}</Track>
          </Row>
        </Card>
        <Card title="Find a parent key">
          <div className="lk">
            <label>Root<select className="sel" value={lkRoot} onChange={(e) => lookup(e.target.value, lkMode)}><option value="" disabled>Root…</option>{MODE_REF.rootLabels.map((l, p) => <option key={p} value={p}>{l}</option>)}</select></label>
            <label>Mode<select className="sel" value={lkMode} onChange={(e) => lookup(lkRoot, e.target.value)}><option value="" disabled>Mode…</option>{MODE_REF.modes.map((m, i) => <option key={i} value={i}>{m.name}</option>)}</select></label>
            <div data-lookup className="lkres" aria-live="polite">{found
              ? <span>Parent key: {key} major ({sc[hit]} {MODE_REF.modes[hit].name} is its {MODE_ORD[hit]} mode)</span>
              : <span className="text-muted" style={{ fontWeight: 500 }}>Choose a root and a mode.</span>}</div>
          </div>
        </Card>
      </div>

      <section className="card" aria-labelledby="modes-title">
        <h2 id="modes-title">Modes of {key} major <span className="text-muted" style={{ fontWeight: 500, marginLeft: 6 }}>{sc.join(" ")}</span></h2>
        <table className="mtab" role="table" aria-labelledby="modes-title">
          <thead role="rowgroup"><tr role="row">{["Deg", "Mode", "Quality", "Root", "Scale tones", "Solo over"].map((h) => <th key={h} role="columnheader" scope="col">{h}</th>)}<th role="columnheader" scope="col"><span className="sr">On the neck, details</span></th></tr></thead>
          {MODE_REF.modes.map((m, i) => {
            const rootPc = (parent + MODE_REF_OFF[i]) % 12;
            const hot = new Set(m.char);
            const name = `${sc[i]} ${m.name}`;
            const isOpen = open.includes(i);
            return (
              <tbody key={i} role="rowgroup" ref={(el) => { rowRefs.current[i] = el; }} className={"mbody" + (hit === i ? " hit" : "")}>
                <tr role="row" className="mrow" data-mode-row={m.name}>
                  <td role="cell" className="c-deg">{m.deg}</td>
                  <td role="cell" className="c-mode" style={{ fontWeight: 700 }}>{m.name}</td>
                  <td role="cell" className="c-q text-muted">{m.quality}</td>
                  <td role="cell" className="c-root" style={{ fontWeight: 700 }}>{sc[i]}</td>
                  <td role="cell" className="c-tones">
                    <span className="mlab">Scale tones</span>
                    {/* Light square: the characteristic tone, from MODE_REF char. Notes shows the name with its number below. */}
                    <div className="tones">{sc.map((_, j) => {
                      const n = sc[(i + j) % 7], f = m.formula[j];
                      return <span key={j} data-tone={j} data-hot={hot.has(j) ? "1" : undefined} className={"tone" + (hot.has(j) ? " hot" : "")}>
                        {view === "numbers" ? f : <React.Fragment>{n}<small>{f}</small></React.Fragment>}
                        {hot.has(j) && <span className="sr"> (characteristic tone)</span>}
                      </span>;
                    })}</div>
                  </td>
                  <td role="cell" className="c-solo"><span className="mlab">Solo over</span><span data-solo>{supText(m.solo)}</span></td>
                  <td role="cell" className="c-act">
                    <div className="macts">
                      <button data-neck={i} onClick={() => onNeck(rootPc, MODES[i][0], sc[i][0])} className="btn text-sm text-link underline" style={{ padding: "0 4px" }}>Show {name} on the neck</button>
                      <Btn onClick={() => toggleOpen(i)} aria-expanded={isOpen} aria-controls={`mdet-${i}`} aria-label={`${m.name} details`} className="btn mtog flex items-center text-sm transition-colors"><span aria-hidden="true" style={{ display: "inline-block", transform: isOpen ? "rotate(90deg)" : "none" }}>▸</span></Btn>
                    </div>
                  </td>
                </tr>
                {isOpen && (
                  <tr role="row" className="mdet"><td role="cell" colSpan={7} id={`mdet-${i}`}>
                    {/* The rest of the ChordCharts row, in its wording. */}
                    <dl className="mdl" data-detail={m.name}>
                      {[["Solo over", supText(m.solo)], ["Vamp", m.vamp], ["Colour note", m.color], ["Avoid / resolve", m.avoid], ["Feel", m.feel]].map(([l, v]) => <div key={l}><dt>{l}</dt><dd>{v}</dd></div>)}
                    </dl>
                  </td></tr>
                )}
              </tbody>
            );
          })}
        </table>
      </section>
    </div>
  );
}

// URL state (UX-18, Round 7): page, key and the Neck, Chords and Modes state, as query parameters. A value at its default is
// left out, so the plain address is the default view. Help is not in the URL. Notes are C, Db … B with s for sharp (Fs, Cs).
const NOTE_TOK = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
const NOTE_IN = (v) => { const t = String(v).replace(/s$/, "#"); const i = NOTE_TOK.indexOf(t); return i >= 0 ? i : NOTES_SHARP.indexOf(t); };
const noteTok = (pc, km) => (km ? KEY_NAME[km][pc] : NOTE_TOK[pc]).replace("#", "s");
const STR_TOK = ["13", "24", "35", "46"];
const STR7_TOK = ["14", "25", "36"];
const STR3_TOK = ["15", "26"]; // drop-3 sets by top and bottom string: 5 3 2 1, 6 4 3 2 (Round 10)
const oneOf = (...vs) => (v) => (vs.includes(v) ? v : undefined);
const intIn = (lo, hi) => (v) => (/^-?\d+$/.test(v) && +v >= lo && +v <= hi ? +v : undefined);
const ARP_KEYS = ["triad", ...QUAL_COMMON.map(([k]) => k).filter((k) => k !== "major" && k !== "minor"), ...QUAL_MORE.flatMap(([, qs]) => qs.map(([k]) => k))];
const listIn = (lo, hi) => (v) => { const a = v.split(".").map(intIn(lo, hi)); return a.every((x) => x !== undefined) && new Set(a).size === a.length ? a : undefined; };
// [parameter, state part, field, default, encode, decode]
const URL_FIELDS = [
  ["p", "top", "page", "neck", String, oneOf("neck", "chords", "modes")],
  ["key", "cfg", "keyRoot", 0, null, NOTE_IN],
  ["mode", "cfg", "keyMode", "major", String, oneOf("major", "minor")],
  ["show", "cfg", "scope", "pentatonic", String, oneOf("arpeggio", "pentatonic", "blended", "blues", "scale")],
  ["chord", "cfg", "arpMode", "diatonic", (v) => (v === "quality" ? "any" : "inkey"), (v) => ({ any: "quality", inkey: "diatonic" })[v]],
  ["q", "cfg", "arp", "triad", String, oneOf(...ARP_KEYS)],
  ["croot", "cfg", "root", 0, (v) => noteTok(v), NOTE_IN],
  ["cmode", "cfg", "tonality", "major", String, oneOf("major", "minor")],
  ["scale", "cfg", "mode", "ionian", String, oneOf(...MODES.map(([k]) => k), ...OTHER_SCALES.map(([k]) => k))],
  ["num", "cfg", "diaLabel", "key", String, oneOf("key", "chord")],
  ["pos", "cfg", "pos", null, String, (v) => (v === "all" ? "all" : intIn(1, 5)(v))],
  ["str", "cfg", "strGroup", null, (v) => STR_TOK[v], (v) => (STR_TOK.includes(v) ? STR_TOK.indexOf(v) : undefined)],
  ["focus", "cfg", "focus", [], (v) => v.join("."), listIn(0, 11)],
  ["labels", "top", "labelMode", "degree", String, oneOf("degree", "name", "none")],
  ["notes", "top", "isolate", false, () => "ct", (v) => (v === "ct" ? true : undefined)],
  ["other", "top", "ghost", false, () => "shown", (v) => (v === "shown" ? true : undefined)],
  ["dots", "top", "dotColour", "caged", String, oneOf("caged", "neutral")],
  ["deg", "ch", "deg", 0, (v) => String(v + 1), (v) => { const n = intIn(1, 7)(v); return n === undefined ? undefined : n - 1; }],
  ["set", "ch", "strSet", 0, (v) => STR_TOK[v], (v) => (STR_TOK.includes(v) ? STR_TOK.indexOf(v) : undefined)],
  ["inv", "ch", "inv", 0, String, intIn(0, 2)],
  ["chords", "ch", "sev", false, () => "7", (v) => (v === "7" ? true : undefined)],
  ["set7", "ch", "strSet7", 0, (v) => STR7_TOK[v], (v) => (STR7_TOK.includes(v) ? STR7_TOK.indexOf(v) : undefined)],
  ["inv7", "ch", "inv7", 0, String, intIn(0, 3)],
  ["drop", "ch", "drop3", false, () => "3", (v) => (v === "3" ? true : undefined)],
  ["set3", "ch", "strSet3", 0, (v) => STR3_TOK[v], (v) => (STR3_TOK.includes(v) ? STR3_TOK.indexOf(v) : undefined)],
  ["inv3", "ch", "inv3", 0, String, intIn(0, 3)],
  ["minor", "ch", "harm", false, () => "harmonic", (v) => (v === "harmonic" ? true : undefined)],
  ["cnum", "ch", "numFrom", "key", String, oneOf("key", "chord")],
  ["behind", "ch", "scaleBehind", false, () => "shown", (v) => (v === "shown" ? true : undefined)],
  ["parent", "md", "parent", 0, (v) => noteTok(v), NOTE_IN],
  ["mview", "md", "view", "notes", String, oneOf("notes", "numbers")],
  ["find", "md", "lkRoot", "", (v) => noteTok(+v), (v) => { const n = NOTE_IN(v); return n < 0 ? undefined : String(n); }],
  ["findmode", "md", "lkMode", "", (v) => String(+v + 1), (v) => { const n = intIn(1, 7)(v); return n === undefined ? undefined : String(n - 1); }],
  ["hit", "md", "hit", null, (v) => String(v + 1), (v) => { const n = intIn(1, 7)(v); return n === undefined ? undefined : n - 1; }],
  ["open", "md", "open", [], (v) => v.map((i) => i + 1).join("."), (v) => { const a = listIn(1, 7)(v); return a && a.map((i) => i - 1); }],
];
const URL_DEFAULT = {
  top: { page: "neck", labelMode: "degree", isolate: false, ghost: false, dotColour: "caged", more: false },
  cfg: { root: 0, tonality: "major", scope: "pentatonic", arp: "triad", pos: null, focus: [], keyRoot: 0, keyMode: "major", arpMode: "diatonic", diaLabel: "key", strGroup: null, mode: "ionian", keySpell: null },
  ch: { deg: 0, strSet: 0, inv: 0, numFrom: "key", scaleBehind: false, sev: false, strSet7: 0, inv7: 0, drop3: false, strSet3: 0, inv3: 0, harm: false },
  md: { parent: 0, view: "notes", hit: null, lkRoot: "", lkMode: "", open: [] },
};
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// More is open by default when the chosen Any chord quality is in it; more=1 or more=0 records any other choice.
const moreDefault = (c) => c.scope === "arpeggio" && c.arpMode === "quality" && QUAL_IN_MORE(c.arp);
function stateToQuery(st) {
  const q = new URLSearchParams();
  URL_FIELDS.forEach(([k, part, f, d, enc]) => {
    const v = st[part][f];
    if (!same(v, d) || (k === "key" && st.cfg.keySpell)) q.set(k, enc ? enc(v) : st.cfg.keySpell ? spellAt(LETTERS.indexOf(st.cfg.keySpell), v).replace("#", "s") : noteTok(v, st.cfg.keyMode));
  });
  if (st.top.more !== moreDefault(st.cfg)) q.set("more", st.top.more ? "1" : "0");
  const t = q.toString();
  return t ? "?" + t : "";
}
function queryToState(search) {
  const q = new URLSearchParams(search);
  const st = { top: { ...URL_DEFAULT.top }, cfg: { ...URL_DEFAULT.cfg }, ch: { ...URL_DEFAULT.ch }, md: { ...URL_DEFAULT.md } };
  URL_FIELDS.forEach(([k, part, f, d, , dec]) => {
    if (!q.has(k)) return;
    const v = dec(q.get(k));
    if (v !== undefined && !(typeof v === "number" && v < 0)) st[part][f] = v;
  });
  // A key written with another letter than the standard name (key=Gb, key=Cb, key=Ds) carries that letter while it costs
  // no more accidentals than the automatic one (Round 9). Any letter with one accidental at most is read.
  const kt = /^([A-G])(b|s)?$/.exec(q.get("key") || "");
  if (kt) {
    const pc = (LETTER_PC[LETTERS.indexOf(kt[1])] + (kt[2] === "b" ? 11 : kt[2] === "s" ? 1 : 0)) % 12;
    st.cfg = normSpell({ ...st.cfg, keyRoot: pc, keySpell: kt[1] });
  }
  // A hand-edited link: a quality with a 3rd takes its own Major / Minor, as a click would.
  if (st.cfg.arp !== "triad" && QUAL_T[st.cfg.arp]) st.cfg.tonality = QUAL_T[st.cfg.arp];
  st.top.more = q.get("more") === "1" ? true : q.get("more") === "0" ? false : moreDefault(st.cfg);
  return st;
}
const URL_INIT = typeof location !== "undefined" ? queryToState(location.search) : queryToState("");

function FretboardTrainer() {
  // Every value starts from the URL (Round 7); with no query it is the v0.30 default.
  const [page, setPage] = useState(URL_INIT.top.page);
  const [labelMode, setLabelMode] = useState(URL_INIT.top.labelMode);
  const [isolate, setIsolate] = useState(URL_INIT.top.isolate);
  const [ghost, setGhost] = useState(URL_INIT.top.ghost);
  const [dotColour, setDotColour] = useState(URL_INIT.top.dotColour);
  const [more, setMore] = useState(URL_INIT.top.more);
  const [help, setHelp] = useState(false);
  const [cfg, setCfgRaw] = useState(URL_INIT.cfg);
  // Every cfg change passes through normSpell, so a carried root letter is dropped when it no longer applies (Round 9).
  const setCfg = (f) => setCfgRaw((c) => normSpell(typeof f === "function" ? f(c) : f));
  // Chords page state (Round 5): chosen degree, string set, inversion, Numbers from, Scale behind. Key lives in cfg.
  const [ch, setCh] = useState(URL_INIT.ch);
  // Modes page state (Round 6): its own parent key (a major key, index = pitch class), Notes / Numbers, the reverse
  // lookup and the rows opened for details. It does not change the key on Neck or Chords until a row link is used.
  const [md, setMd] = useState(URL_INIT.md);
  // The URL follows the state: a page change adds a history step, so Back returns to the previous page; any other change
  // replaces the current step. Back and Forward restore the state the step held (Round 7).
  const lastPage = React.useRef(page);
  useEffect(() => {
    const st = { top: { page, labelMode, isolate, ghost, dotColour, more }, cfg, ch, md };
    const url = location.pathname + stateToQuery(st) + location.hash;
    const push = lastPage.current !== page;
    lastPage.current = page;
    if (url === location.pathname + location.search + location.hash && !push) return;
    try { history[push ? "pushState" : "replaceState"](null, "", url); } catch (e) { /* a sandboxed frame: the URL stays */ }
  }, [page, labelMode, isolate, ghost, dotColour, more, cfg, ch, md]);
  useEffect(() => {
    const onPop = () => {
      const st = queryToState(location.search);
      lastPage.current = st.top.page;
      setPage(st.top.page); setLabelMode(st.top.labelMode); setIsolate(st.top.isolate); setGhost(st.top.ghost); setDotColour(st.top.dotColour); setMore(st.top.more);
      setCfgRaw(st.cfg); setCh(st.ch); setMd(st.md); setHelp(false);
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  // Copy link: the share sheet on a touch device that has one, else the clipboard; the button reads "Copied" for 2 s.
  const [copied, setCopied] = useState("");
  const copyLink = async () => {
    const url = location.href;
    const done = (t) => { setCopied(t); setTimeout(() => setCopied(""), 2000); };
    if (navigator.share && window.matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ title: "Fretboard Trainer", url }); } catch (e) { /* dismissed */ }
      return;
    }
    try { await navigator.clipboard.writeText(url); done("Copied"); return; } catch (e) { /* fall back below */ }
    const ta = document.createElement("textarea");
    ta.value = url; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok ? "Copied" : "Not copied");
  };
  const globals = { labelMode, isolate, ghost, dotColour, more, setLabelMode, setIsolate, setGhost, setDotColour, setMore };
  // Another key drops a carried root letter (Round 9); the same key tapped again keeps it.
  const up = (p) => setCfg((c) => ({ ...c, ...p, ...(p.keyRoot !== undefined && p.keyRoot !== c.keyRoot ? { keySpell: null } : {}) }));

  // Examples (was Quick start): trainer state only, Strings included; Labels, View and Other notes stay (UX-15, decision 13 = a).
  const applyPreset = (p) => {
    if (p === "interlock") {
      setCfg((c) => ({ ...c, scope: "pentatonic", pos: "all", strGroup: null, focus: [] }));
      setIsolate(false);
    } else if (p === "chordtones") {
      setCfg((c) => ({ ...c, scope: "scale", pos: null, strGroup: null, focus: [] }));
      setIsolate(true);
    } else if (p === "dom7") {
      setCfg((c) => ({ ...c, scope: "arpeggio", arpMode: "quality", arp: "dom7", tonality: "major", keyMode: "major", root: c.keyRoot, pos: null, strGroup: null, focus: [10] }));
      setIsolate(false);
    } else if (p === "walk") {
      setCfg((c) => ({ ...c, scope: "arpeggio", arpMode: "diatonic", diaLabel: "key", arp: "triad", tonality: c.keyMode, root: c.keyRoot, pos: null, strGroup: null, focus: [] }));
      setIsolate(false);
    }
    setHelp(false);
    setPage("neck");
  };
  // A Modes row link lands on the Neck page in the state that Key (the mode root), then Show → Scale, then Mode would give
  // there (Round 6). Filters, Labels and Other notes stay, as they do for those clicks.
  const showMode = (r, mk, letter) => {
    setCfg((c) => {
      let n = { ...c, root: r, keyRoot: r, ...keepChord(c, c.keyMode) };
      if (n.scope !== "scale") n = { ...n, scope: "scale", root: n.keyRoot, ...keepChord(n, n.keyMode) };
      const q = MODE_Q(mk);
      n = q === n.keyMode ? { ...n, mode: mk } : { ...n, mode: mk, keyMode: q, root: n.keyRoot, ...keepChord(n, q) };
      // The row's own root letter (G♭, A♭, C♭, D♯, A♯) goes with it (Round 9); normSpell keeps it only where it is a tie or better.
      return { ...n, keySpell: letter };
    });
    setHelp(false);
    setPage("neck");
  };
  // Clear: filters only; Key and Show stay (decision 12 = a).
  const anyFilter = cfg.pos !== null || cfg.strGroup !== null || cfg.focus.length > 0 || isolate;
  const clearAll = () => { up({ pos: null, strGroup: null, focus: [] }); setIsolate(false); };

  return (
    <div className="w-full" style={{ background: THEME.bg, color: THEME.text }}>
      <div className="p-4">
      {/* One 44 px head (IA-03): plain text title (decision 15 = a), the page switch (IA-review, mock-up A), Copy link, Help and Clear.
          On a phone the switch takes its own row. A page choice closes Help; Clear acts on the Neck page only. */}
      <header className="head">
        <h1 className="text-xl font-bold text-body" style={{ margin: 0, whiteSpace: "nowrap" }}>Fretboard Trainer</h1>
        <nav className="pagenav" aria-label="Pages">
          <Track label="Page" cols={3}>{[["neck","Neck"],["chords","Chords"],["modes","Modes"]].map(([k,l]) => <Seg key={k} active={page === k && !help} onClick={() => { setPage(k); setHelp(false); }}>{l}</Seg>)}</Track>
        </nav>
        <div className="hbtns">
          <Btn onClick={copyLink} aria-live="polite" className="btn copyl text-sm transition-colors">{copied || "Copy link"}</Btn>
          <Btn onClick={() => setHelp((h) => !h)} aria-pressed={help} className="btn hb hb1 text-sm transition-colors">Help</Btn>
          <Btn onClick={clearAll} disabled={!anyFilter || page !== "neck"} className="btn hb text-sm transition-colors">Clear</Btn>
        </div>
      </header>

      {help ? <Help onExample={applyPreset} /> : page === "neck" ? <Board cfg={cfg} update={up} globals={globals} /> : page === "chords" ? <ChordsPage cfg={cfg} update={up} ch={ch} setCh={setCh} /> : <ModesPage md={md} setMd={setMd} onNeck={showMode} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FretboardTrainer />);
</script>
</body>
</html>
