  html,body{margin:0;background:#0D131A;font-family:"FT Music",ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

  .p-4{padding:1rem}.p-3{padding:.75rem}.p-2{padding:.5rem}

  .px-2\.5{padding-left:.625rem;padding-right:.625rem}
  .py-1{padding-top:.25rem;padding-bottom:.25rem}
  .py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
  .py-0\.5{padding-top:.125rem;padding-bottom:.125rem}
  .mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}

  .items-center{align-items:center}.items-end{align-items:flex-end}
  .justify-center{justify-content:center}
  .gap-1{gap:.25rem}.gap-1\.5{gap:.375rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}
  .relative{position:relative}.absolute{position:absolute}.left-0{left:0}.right-0{right:0}
  .overflow-x-auto{overflow-x:auto}
  .text-xs{font-size:12.5px;line-height:1rem}
  .text-sm{font-size:.875rem;line-height:1.25rem}
  .text-xl{font-size:1.25rem;line-height:1.75rem}
  .font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
  .underline{text-decoration:underline}
  .text-body{color:#E3E9F0}.text-muted{color:#A9B6C4}.text-link{color:#9CC6EE}
  /* Rows inside a group card: label above its controls (IA-05). */
  .row{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .rowlab{font-size:12.5px;color:#A9B6C4;white-space:nowrap}
  .track{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:8px;background:#091017;min-width:0}
  /* Equal-cell grid (Round 4b, mock-up C): minmax(0, 1fr) cells, each as wide as the widest label when there is room and
     still equal when there is not; a tight cell keeps its label centred in the padding. */
  .gtrack{display:inline-grid;max-width:100%}
  .gtrack .seg{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
  @media (max-width:379px){.gtrack .seg{font-size:13px}}
  /* The Show sub-panel hangs off the chosen Show cell: caret and inset surface (Round 4b). */
  .subpanel{margin-top:8px;background:#1B2530;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .caret{position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:8px solid #1B2530;pointer-events:none}
  .subpanel h3{margin:0;font-size:.875rem;line-height:1.25rem;font-weight:700;color:#E3E9F0}
  .pagenav{display:flex}
  @media (max-width:699px){.pagenav{order:3;flex-basis:100%}}
  /* Chords page (Round 5): the chord strip and the two control groups (mock-ups D and E). */
  .strip{display:flex;align-items:stretch;gap:6px;margin-top:8px}
  .strip .btn{height:auto;min-height:34px}
  .striptrack{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:2px;border-radius:8px;background:#091017;min-width:0}
  @media (max-width:639px){.striptrack{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .stripcell{min-width:0;padding:6px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;min-height:44px}
  .cgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;align-items:start}
  @media (min-width:1200px){.cgroups{grid-template-columns:1fr 2.4fr}}
  .crows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px 16px}
  /* Modes page (Round 6, mock-up F): two control cards, then the parent-key table. Below 1,024 px each mode is a card;
     the table keeps explicit roles so it still reads as a table when its display changes. */
  .mtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;align-items:start;margin-bottom:12px}
  .sel{height:34px;min-width:110px;padding:0 8px;border-radius:8px;background:#2A3645;color:#E3E9F0;border:1px solid #6C7C8E;font:inherit;font-size:.875rem}
  @media (pointer:coarse){.sel{height:44px}}
  .lk{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px}
  .lk label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#A9B6C4}
  .lkres{min-height:34px;display:flex;align-items:center;font-size:.875rem;font-weight:600}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .mtab{width:100%;border-collapse:collapse;font-size:13px;color:#E3E9F0}
  .mtab th{color:#A9B6C4;font-size:12.5px;font-weight:600;text-align:left;padding:6px 8px;white-space:nowrap}
  .mtab td{padding:6px 8px;vertical-align:middle;border-top:1px solid #334252}
  .mtab .mdet td{border-top:0;padding:0 8px 10px}
  .mbody.hit .mrow td{background:#1B2530}
  .mbody.hit .mrow td:first-child{box-shadow:inset 3px 0 0 #E3E9F0}
  .tones{display:flex;gap:2px}
  .tone{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:36px;min-height:30px;padding:3px 2px;border-radius:4px;font-weight:600;line-height:1.2}
  .tone small{font-size:11px;font-weight:500;color:#A9B6C4}
  .tone.hot{background:#E3E9F0;color:#16232F}.tone.hot small{color:#16232F}
  .mlab{display:none}
  .macts{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap}
  .mtog{min-width:34px;justify-content:center}
  @media (pointer:coarse){.mtog{min-width:44px}}
  .mdl{margin:0;background:#1B2530;border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 24px}
  .mdl div{min-width:120px}.mdl dt{font-size:12.5px;color:#A9B6C4}.mdl dd{margin:2px 0 0;font-size:13px;line-height:1.4}
  @media (max-width:1023px){
    .mtab,.mtab tbody,.mtab tr,.mtab td{display:block}
    .mtab{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:8px;align-items:start}
    .mtab thead{display:none}
    .mtab tbody{background:#1B2530;border-radius:8px;padding:10px;min-width:0}
    .mtab .mrow{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"deg root mode q" "tones tones tones tones" "solo solo solo solo" "act act act act";gap:8px;align-items:center}
    .mtab td,.mtab .mdet td{border:0;padding:0}
    .c-deg{grid-area:deg;color:#A9B6C4}.c-root{grid-area:root}.c-mode{grid-area:mode}.c-q{grid-area:q}.c-tones{grid-area:tones}.c-solo{grid-area:solo}.c-act{grid-area:act}
    .mlab{display:block;font-size:12.5px;color:#A9B6C4;margin-bottom:2px}
    .macts{justify-content:space-between}
    .mbody.hit{box-shadow:0 0 0 1.5px #E3E9F0}
    .mbody.hit .mrow td{background:transparent}.mbody.hit .mrow td:first-child{box-shadow:none}
    .mtab .mdet td{padding-top:8px}.mdl{background:#141C25}
  }
  .transition-colors{transition:background-color .15s,border-color .15s,color .15s}
  .transition-all{transition:all .15s}
  /* Control heights: 34 px on desktop, 44 px on touch (A11y-W2, the ChordCharts device rule). */
  .seg{height:30px}.btn,.chip{height:34px}
  @media (pointer:coarse){.seg,.btn,.chip{height:44px}}
  /* Head, summary line and board first; four groups below (UX-01, IA-03, IA-05). */
  .head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:44px;margin-bottom:8px}
  /* Copy link (Round 7): beside Help on a wide head. Below 700 px, where the three buttons and the page switch cannot share
     the title's row, it ends the page-switch row, so the head keeps two rows. */
  .hbtns{display:flex;gap:8px;margin-left:auto}
  .head .copyl{min-width:100px;justify-content:center}
  @media (max-width:699px){.hbtns{display:contents}.hbtns .hb1{margin-left:auto}.pagenav{flex:1 1 calc(100% - 124px)}.head .copyl{order:4}}
  .sumrow{display:flex;align-items:center;gap:8px;min-height:34px;overflow-x:auto;white-space:nowrap;margin-bottom:8px}
  @media (pointer:coarse){.sumrow{min-height:44px}}
  .boardwrap{background:#0D131A;padding-bottom:8px}
  /* Sticky on a phone held upright, so the result of a tap stays on screen (RS-03). */
  @media (max-width:899px) and (min-height:600px){.boardwrap{position:sticky;top:0;z-index:10}}
  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;align-items:start}
  /* Desktop: the four groups in one row, Show widest for its panel (mock-up A); below, two columns or one. */
  @media (min-width:1200px){.groups{grid-template-columns:1fr 1.4fr 1fr .8fr}}
  .card{background:#141C25;border-radius:.5rem;padding:.75rem;display:flex;flex-direction:column;gap:10px;min-width:0}
  .card h2{margin:0;font-size:.875rem;line-height:1.25rem;font-weight:700;color:#E3E9F0}
  /* The ChordCharts focus ring (A11y-S1). */
  :focus-visible{outline:2px solid #9CC6EE;outline-offset:2px}
  :focus:not(:focus-visible){outline:none}
  /* Reduced motion, as in ChordCharts (A11y-S2). */
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

  major: ["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"],

const OPEN_ABS = [64,59,55,50,45,40]; // e4 B3 G3 D3 A2 E2 as MIDI numbers, for pitch order across strings
const STRING_LABELS = ["e","B","G","D","A","E"];
